<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>报价打印预览</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="print-core.js"></script>
  <script src="print-template.js"></script>
  <script src="print-actions.js"></script>
</head>
<body>
  <style id="print-style"></style>
  <header class="toolbar no-print" id="toolbar">
    <span class="title" id="proj-title">报价打印预览</span>
    <span class="group">
      <label>纸型</label>
      <select id="paper"></select>
      <label>方向</label>
      <select id="orientation">
        <option value="portrait">纵向</option>
        <option value="landscape">横向</option>
      </select>
      <label>自定义 mm</label>
      <input id="customW" type="number" min="50" max="2000" value="210" style="width:55px"/>
      <input id="customH" type="number" min="50" max="2000" value="297" style="width:55px"/>
    </span>
    <span class="group">
      <label>范围</label>
      <select id="rangeMode">
        <option value="all">全部</option>
        <option value="current">当前页</option>
        <option value="odd">奇数页</option>
        <option value="even">偶数页</option>
        <option value="custom">自定义</option>
      </select>
      <input id="rangeExpr" type="text" placeholder="1-5,8,11-13" style="width:120px"/>
    </span>
    <span class="group">
      <label>双面</label>
      <select id="duplex">
        <option value="single">单面</option>
        <option value="longEdge">双面 长边</option>
        <option value="shortEdge">双面 短边</option>
      </select>
      <label>份数</label>
      <input id="copies" type="number" min="1" max="999" value="1" style="width:50px"/>
    </span>
    <span class="group">
      <label>颜色</label>
      <select id="color">
        <option value="color">彩色</option>
        <option value="bw">黑白</option>
      </select>
      <label>打印机</label>
      <select id="printer"></select>
    </span>
    <span class="group">
      <label>缩放</label>
      <span id="zoom-display">100%</span>
      <button id="zoom-out" class="secondary">−</button>
      <button id="zoom-in" class="secondary">+</button>
    </span>
    <span class="group">
      <button id="btn-save-pdf">保存 PDF</button>
      <button id="btn-print">打印</button>
      <button id="btn-close" class="secondary">关闭</button>
    </span>
  </header>

  <main class="layout">
    <aside class="nav no-print" id="nav">
      <h3>页面</h3>
      <div class="thumb-list" id="thumb-list"></div>
    </aside>
    <section class="stage" id="stage">
      <div class="papers" id="papers"></div>
    </section>
  </main>

<script>
(function () {
  'use strict';

  // -------- load data from URL params --------
  function getParam(name) {
    const u = new URL(window.location.href);
    return u.searchParams.get(name);
  }

  function decodeData(b64) {
    try {
      // Unicode-safe base64 decode: atob -> bytes -> percent-encoded UTF-8 -> URI decode.
      const bin = atob(b64 || '');
      const bytes = bin.split('').map(function (c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join('');
      const json = decodeURIComponent(bytes);
      return JSON.parse(json);
    } catch (e) {
      console.error('decode failed', e && e.message ? e.message : e);
      return null;
    }
  }

  // -------- state --------
  const state = Object.assign({}, PrintCore.DEFAULT_STATE);
  let currentData = null;
  let paperEls = [];

  // -------- initialise paper select --------
  function initPaperSelect() {
    const sel = document.getElementById('paper');
    const keys = Object.keys(PrintCore.PAPER_SIZES);
    sel.innerHTML = keys.map(function (k) {
      return '<option value="' + k + '">' + k + '</option>';
    }).join('');
    sel.value = state.paper;
  }

  // -------- apply state to toolbar --------
  function applyStateToUI() {
    document.getElementById('paper').value = state.paper;
    document.getElementById('orientation').value = state.orientation;
    document.getElementById('rangeMode').value = state.rangeMode;
    document.getElementById('rangeExpr').value = state.rangeExpr || '';
    document.getElementById('duplex').value = state.duplex;
    document.getElementById('copies').value = state.copies;
    document.getElementById('color').value = state.color;
    document.getElementById('zoom-display').textContent = state.zoom + '%';
  }

  // -------- render papers --------
  function renderPapers() {
    const stage = document.getElementById('papers');
    stage.innerHTML = '';
    let html = '';
    if (!currentData) {
      html = PrintTemplate.renderQuoteTemplate({ projectInfo: { name: '示例工程' } });
    } else {
      switch (state.template) {
        case 'changeOrder': html = PrintTemplate.renderChangeOrderTemplate(currentData); break;
        case 'materialBook': html = PrintTemplate.renderMaterialBookTemplate(currentData); break;
        case 'cover': html = PrintTemplate.renderCoverTemplate(currentData); break;
        default: html = PrintTemplate.renderQuoteTemplate(currentData);
      }
    }
    stage.innerHTML = html;
    paperEls = Array.from(stage.querySelectorAll('.paper'));
    rebuildThumbs();
    applyExclusionAndCSS();
  }

  // -------- thumbnails --------
  function rebuildThumbs() {
    const list = document.getElementById('thumb-list');
    list.innerHTML = paperEls.map(function (el, idx) {
      const p = idx + 1;
      const label = (el.querySelector('.cat-title, .cover-title, .page-title, .cover-cn'));
      const txt = label ? label.textContent.slice(0, 18) : '第 ' + p + ' 页';
      return '<div class="thumb" data-page="' + p + '">' +
        '<span class="num">' + p + '</span>' +
        '<span class="label">' + txt + '</span>' +
        '</div>';
    }).join('');
    list.querySelectorAll('.thumb').forEach(function (t) {
      t.addEventListener('click', function () {
        const p = parseInt(t.dataset.page, 10);
        const target = paperEls[p - 1];
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // -------- apply exclusion + CSS --------
  function applyExclusionAndCSS() {
    const total = paperEls.length;
    const selected = PrintCore.resolveRange(state, total, 1);
    PrintCore.applyExclusion(paperEls, selected);
    PrintCore.applyCSS(document.getElementById('print-style'), state);
    // document zoom
    document.documentElement.style.setProperty('--paper-zoom', state.zoom / 100);
  }

  // -------- bind events --------
  function bindEvents() {
    document.getElementById('paper').addEventListener('change', function (e) {
      state.paper = e.target.value;
      applyExclusionAndCSS();
    });
    document.getElementById('orientation').addEventListener('change', function (e) {
      state.orientation = e.target.value;
      applyExclusionAndCSS();
    });
    document.getElementById('customW').addEventListener('change', function (e) {
      state.customW = Number(e.target.value) || 210;
      if (state.paper === '自定义') applyExclusionAndCSS();
    });
    document.getElementById('customH').addEventListener('change', function (e) {
      state.customH = Number(e.target.value) || 297;
      if (state.paper === '自定义') applyExclusionAndCSS();
    });
    document.getElementById('rangeMode').addEventListener('change', function (e) {
      state.rangeMode = e.target.value;
      applyExclusionAndCSS();
    });
    document.getElementById('rangeExpr').addEventListener('change', function (e) {
      state.rangeExpr = e.target.value;
      if (state.rangeMode === 'custom') applyExclusionAndCSS();
    });
    document.getElementById('duplex').addEventListener('change', function (e) { state.duplex = e.target.value; });
    document.getElementById('copies').addEventListener('change', function (e) {
      state.copies = Math.max(1, Math.min(999, parseInt(e.target.value, 10) || 1));
    });
    document.getElementById('color').addEventListener('change', function (e) {
      state.color = e.target.value;
      PrintCore.applyCSS(document.getElementById('print-style'), state);
    });
    document.getElementById('zoom-in').addEventListener('click', function () {
      state.zoom = PrintCore.clamp((state.zoom || 100) + 10, 25, 300);
      document.documentElement.style.setProperty('--paper-zoom', state.zoom / 100);
      document.getElementById('zoom-display').textContent = state.zoom + '%';
    });
    document.getElementById('zoom-out').addEventListener('click', function () {
      state.zoom = PrintCore.clamp((state.zoom || 100) - 10, 25, 300);
      document.documentElement.style.setProperty('--paper-zoom', state.zoom / 100);
      document.getElementById('zoom-display').textContent = state.zoom + '%';
    });
    document.getElementById('btn-print').addEventListener('click', function () {
      PrintActions.print();
    });
    document.getElementById('btn-save-pdf').addEventListener('click', function () {
      PrintActions.savePDF();
    });
    document.getElementById('btn-close').addEventListener('click', function () {
      PrintActions.close();
    });
    // Ctrl+wheel zoom
    PrintCore.attachZoom(document.body, state, function (z) {
      document.documentElement.style.setProperty('--paper-zoom', z / 100);
      document.getElementById('zoom-display').textContent = z + '%';
    });
  }

  // -------- load printers --------
  async function loadPrinters() {
    const sel = document.getElementById('printer');
    const list = await PrintCore.listPrinters();
    sel.innerHTML = (list || []).map(function (p) {
      return '<option value="' + p + '">' + p + '</option>';
    }).join('');
    if (list && list.length) sel.value = list[0];
  }

  // -------- bootstrap --------
  function init() {
    initPaperSelect();
    applyStateToUI();
    const b64 = getParam('data');
    const title = getParam('title') || '';
    if (title) document.getElementById('proj-title').textContent = title;
    if (b64) currentData = decodeData(b64);
    bindEvents();
    renderPapers();
    loadPrinters();
    // preload images sequentially to avoid OOM
    PrintCore.preloadImages(Array.from(document.images));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
