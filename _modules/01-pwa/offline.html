<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>离线模式 · 装企报价</title>
  <style>
    :root { color-scheme: light dark; --c: #6366f1; --bg: #fafaff; --fg: #1e293b; --muted: #64748b; --warn: #f59e0b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; line-height: 1.6;
    }
    .card {
      max-width: 480px; width: 100%; padding: 32px 28px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(99,102,241,0.2);
      border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,0.08);
      backdrop-filter: blur(8px);
    }
    .icon { width: 56px; height: 56px; margin-bottom: 16px; color: var(--c); }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;
    }
    .stat {
      padding: 12px 14px; border-radius: 10px;
      background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.15);
    }
    .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .stat .v { font-size: 18px; font-weight: 600; }
    .alert {
      padding: 12px 14px; border-radius: 10px; margin-bottom: 20px;
      background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3);
      color: var(--warn); font-size: 13px;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      flex: 1 1 auto; min-width: 140px; padding: 12px 16px;
      border: none; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 500;
    }
    .btn-primary {
      background: var(--c); color: #fff;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-ghost {
      background: transparent; color: var(--fg); border: 1px solid rgba(99,102,241,0.4);
    }
    .btn-ghost:hover { background: rgba(99,102,241,0.08); }
    .meta { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
    </svg>
    <h1>当前处于离线模式</h1>
    <p class="sub">您仍可访问已缓存的报价项目,工地现场无网络也能继续工作。</p>

    <div class="stats">
      <div class="stat">
        <div class="k">本地未同步</div>
        <div class="v" id="pending">—</div>
      </div>
      <div class="stat">
        <div class="k">上次同步</div>
        <div class="v" id="lastSync">—</div>
      </div>
    </div>

    <div class="alert" id="alert" hidden></div>

    <div class="actions">
      <button class="btn-primary" id="retry">重试连接</button>
      <button class="btn-ghost" id="goApp">继续本地工作</button>
    </div>
    <div class="meta">yunshu-zhuangqi PWA · 离线 shell r31202</div>
  </div>

  <script>
    (function () {
      function fmt(t) {
        if (!t) return '从未同步';
        var d = new Date(t);
        if (isNaN(d.getTime())) return '从未同步';
        var diff = Math.floor((Date.now() - d.getTime()) / 60000);
        if (diff < 1) return '刚刚';
        if (diff < 60) return diff + ' 分钟前';
        if (diff < 1440) return Math.floor(diff / 60) + ' 小时前';
        return Math.floor(diff / 1440) + ' 天前';
      }
      function safeReadLS(k) {
        try { return localStorage.getItem(k); } catch (e) { return null; }
      }
      var lastSync = safeReadLS('ys.lastSync') || '';
      var pendingRaw = safeReadLS('ys.pendingCount');
      var pending = parseInt(pendingRaw, 10);

      document.getElementById('lastSync').textContent = fmt(lastSync);
      document.getElementById('pending').textContent = isNaN(pending) ? '0' : pending;

      var alert = document.getElementById('alert');
      if (!isNaN(pending) && pending > 0) {
        alert.textContent = '您有 ' + pending + ' 个项目尚未同步,网络恢复后将自动上传。';
        alert.hidden = false;
      } else if (!safeReadLS('ys.installed')) {
        alert.textContent = '首次访问需联网初始化缓存。';
        alert.hidden = false;
      }

      document.getElementById('retry').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = '检测中…';
        window.setTimeout(function () { window.location.reload(); }, 800);
      });
      document.getElementById('goApp').addEventListener('click', function () {
        window.location.href = './app.html';
      });

      window.addEventListener('online', function () { window.location.reload(); });
    })();
  </script>
</body>
</html>
