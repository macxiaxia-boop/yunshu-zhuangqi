<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工料分项 · cost-composition</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#f7f8fa; margin:0; padding:16px; color:#222; }
  h1 { font-size:16px; margin:0 0 12px; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  label { width:90px; font-size:13px; color:#555; }
  input[type=number] { flex:1; padding:6px 8px; border:1px solid #d0d4d9; border-radius:4px;
                       font-size:14px; max-width:140px; }
  input.composite { background:#fffbe6; font-weight:600; }
  .mode-bar { display:flex; gap:6px; margin:8px 0; }
  .mode-btn { padding:4px 10px; border:1px solid #d0d4d9; border-radius:4px; cursor:pointer;
              background:#fff; font-size:12px; }
  .mode-btn.active { background:#2b6cb0; color:#fff; border-color:#2b6cb0; }
  .toggle-btn { padding:4px 10px; border:1px solid #d0d4d9; border-radius:4px; cursor:pointer;
                background:#fff; font-size:12px; margin-left:auto; }
  .advanced { display:none; margin-top:8px; padding:8px; background:#fff; border:1px dashed #d0d4d9; border-radius:4px; }
  .advanced.show { display:block; }
  .adv-row { display:flex; align-items:center; gap:6px; font-size:12px; margin:2px 0; color:#888; }
  .adv-row .v { color:#333; font-weight:600; font-family:monospace; }
  .status { font-size:11px; padding:2px 6px; border-radius:3px; }
  .status.ok { background:#e6ffed; color:#22863a; }
  .status.pending { background:#fff5b1; color:#735c0f; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .btn { padding:6px 14px; border-radius:4px; cursor:pointer; border:1px solid #d0d4d9;
         background:#fff; font-size:13px; }
  .btn-primary { background:#2b6cb0; color:#fff; border-color:#2b6cb0; }
  .footer-note { font-size:11px; color:#888; margin-top:10px; }
</style>
</head>
<body>
  <h1>工料分项 · <span id="item-name">未命名</span></h1>
  <div class="row">
    <span class="status" id="status">ok</span>
    <button class="toggle-btn" id="toggle-advanced">高级 ▼</button>
  </div>
  <div class="mode-bar">
    <button class="mode-btn active" data-mode="auto">auto · 自动</button>
    <button class="mode-btn" data-mode="manual">manual · 手动</button>
    <button class="mode-btn" data-mode="lock">lock · 锁定</button>
  </div>

  <div class="row">
    <label>人工费 (labor)</label>
    <input type="number" id="labor-cost" step="0.01" min="0">
  </div>
  <div class="row">
    <label>材料费 (material)</label>
    <input type="number" id="material-cost" step="0.01" min="0">
  </div>
  <div class="row">
    <label>辅料费 (auxiliary)</label>
    <input type="number" id="auxiliary-cost" step="0.01" min="0">
  </div>
  <div class="row">
    <label>综合单价</label>
    <input type="number" id="composite-price" step="0.01" min="0" class="composite">
  </div>

  <div class="advanced" id="advanced-panel">
    <div class="adv-row">laborCost: <span class="v" id="adv-labor">—</span></div>
    <div class="adv-row">materialCost: <span class="v" id="adv-material">—</span></div>
    <div class="adv-row">auxiliaryCost: <span class="v" id="adv-auxiliary">—</span></div>
    <div class="adv-row">compositePrice: <span class="v" id="adv-composite">—</span></div>
    <div class="adv-row">compositeAuto: <span class="v" id="adv-auto">—</span></div>
    <div class="adv-row">autoCalc: <span class="v" id="adv-autocalc">auto</span></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="save-btn">保存并推送</button>
    <button class="btn" id="cancel-btn">取消</button>
  </div>
  <div class="footer-note">仅基装工程支持工料分项, 主材不分。窗口通过 window.opener 推送回父窗 ydata.updateItem。</div>

<script src="./material-calc.js"></script>
<script>
(function () {
  // ===== 接收父窗 item =====
  function getQueryItem() {
    try {
      const raw = window.name ? decodeURIComponent(window.name) : '';
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  const item = getQueryItem() || {
    name: '示例 · 拆除墙砖',
    unit: 'm2',
    qty: 30,
    price: 50,
    laborCost: 30, materialCost: 15, auxiliaryCost: 5, compositePrice: 50,
  };

  document.getElementById('item-name').textContent = item.name || '未命名';

  const els = {
    labor:    document.getElementById('labor-cost'),
    material: document.getElementById('material-cost'),
    auxiliary:document.getElementById('auxiliary-cost'),
    composite:document.getElementById('composite-price'),
    status:   document.getElementById('status'),
    adv:      document.getElementById('advanced-panel'),
    toggle:   document.getElementById('toggle-advanced'),
    advLabor: document.getElementById('adv-labor'),
    advMat:   document.getElementById('adv-material'),
    advAux:   document.getElementById('adv-auxiliary'),
    advComp:  document.getElementById('adv-composite'),
    advAuto:  document.getElementById('adv-auto'),
  };

  let mode = item._mode || 'auto';
  let state = window.MaterialCalc.processItem(item, {}, mode);

  function render() {
    els.labor.value    = state.laborCost;
    els.material.value = state.materialCost;
    els.auxiliary.value= state.auxiliaryCost;
    els.composite.value= state.compositePrice;

    const lockFields = mode === 'lock';
    els.labor.disabled    = lockFields;
    els.material.disabled = lockFields;
    els.auxiliary.disabled= lockFields;

    // status
    const v = window.MaterialCalc.validateItem(state);
    els.status.textContent = v.status;
    els.status.className = 'status ' + v.status;

    // advanced
    els.advLabor.textContent = state.laborCost;
    els.advMat.textContent   = state.materialCost;
    els.advAux.textContent   = state.auxiliaryCost;
    els.advComp.textContent  = state.compositePrice;
    els.advAuto.textContent  = state.compositeAuto ? 'true' : 'false';

    // mode buttons
    document.querySelectorAll('.mode-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  function bindInput(el, key) {
    el.addEventListener('input', () => {
      const val = el.value === '' ? 0 : Number(el.value);
      const patch = {}; patch[key] = val;
      try {
        state = window.MaterialCalc.processItem(state, patch, mode);
        render();
      } catch (e) {
        // 校验失败 → 不更新
        el.style.borderColor = '#e53e3e';
        setTimeout(() => { el.style.borderColor = ''; }, 800);
      }
    });
  }
  bindInput(els.labor,    'laborCost');
  bindInput(els.material, 'materialCost');
  bindInput(els.auxiliary,'auxiliaryCost');
  bindInput(els.composite,'compositePrice');

  // mode switch
  document.querySelectorAll('.mode-btn').forEach((b) => {
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      state = window.MaterialCalc.processItem(state, {}, mode);
      render();
    });
  });

  // advanced toggle
  els.toggle.addEventListener('click', () => {
    els.adv.classList.toggle('show');
    els.toggle.textContent = els.adv.classList.contains('show') ? '高级 ▲' : '高级 ▼';
  });

  // save → push to opener
  document.getElementById('save-btn').addEventListener('click', () => {
    const payload = Object.assign({}, state, { _mode: mode });
    try {
      if (window.opener && window.opener.ydata && typeof window.opener.ydata.updateItem === 'function') {
        window.opener.ydata.updateItem(payload);
      }
    } catch (e) { /* cross-origin silent */ }
    window.close();
  });
  document.getElementById('cancel-btn').addEventListener('click', () => window.close());

  render();
})();
</script>
</body>
</html>
