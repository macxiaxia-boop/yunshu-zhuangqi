<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享链接管理 · yunshu-zhuangqi</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  background: #f8f9fa;
  color: #2a2a2a;
  padding: 20px;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 22px; color: #C04851; margin-bottom: 16px; }
.toolbar {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.toolbar input {
  flex: 1;
  min-width: 180px;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
}
.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
  transition: opacity 0.15s, transform 0.15s;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: #C04851; color: #fff; }
.btn-secondary { background: #f0f0f0; color: #555; }
.btn-danger { background: #dc3545; color: #fff; }
.btn-success { background: #28a745; color: #fff; }
.btn-icon { padding: 6px 10px; font-size: 13px; }
table {
  width: 100%;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border-collapse: collapse;
}
th, td {
  padding: 12px 14px;
  text-align: left;
  font-size: 13px;
  border-bottom: 1px solid #f0f0f0;
}
th { background: #fafafa; color: #888; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
tr:last-child td { border-bottom: none; }
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
}
.badge.active { background: rgba(40, 167, 69, 0.12); color: #28a745; }
.badge.expired { background: rgba(220, 53, 69, 0.12); color: #dc3545; }
.badge.actions { background: rgba(192, 72, 81, 0.12); color: #C04851; }
.share-id {
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 12px;
  color: #666;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
.modal-backdrop {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999;
}
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 { color: #C04851; margin-bottom: 16px; font-size: 18px; }
.modal-row { padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
.modal-row:last-child { border-bottom: none; }
.modal-actions { margin-top: 16px; display: flex; gap: 8px; justify-content: flex-end; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #fff;
  padding: 10px 16px; border-radius: 8px; font-size: 13px;
  z-index: 99999; opacity: 0; transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast.ok { background: rgba(40,167,69,0.95); }
.toast.no { background: rgba(220,53,69,0.95); }
.summary-bar {
  background: linear-gradient(135deg, #C04851 0%, #F5C0C0 100%);
  color: #fff;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}
.summary-item { }
.summary-num { font-size: 22px; font-weight: 700; }
.summary-lbl { font-size: 12px; opacity: 0.85; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 分享链接管理</h1>
  <div class="summary-bar" id="summary"></div>
  <div class="toolbar">
    <input type="password" id="secret" placeholder="管理员密钥（演示版任意输入）" value="demo">
    <button class="btn btn-primary" onclick="loadList()">刷新列表</button>
    <button class="btn btn-secondary" onclick="exportCSV()">📥 导出 CSV</button>
    <button class="btn btn-secondary" onclick="runGC()">🧹 清理过期</button>
  </div>
  <div id="table-wrap"></div>
</div>

<script src="share-qr.js"></script>
<script src="share-api-mock.js"></script>
<script src="share-actions.js"></script>
<script src="share-create.js"></script>

<script>
(function () {
  'use strict';

  var ALL_SHARES = [];

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function fmt(n) {
    return Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }

  function fmtDate(t) {
    if (!t) return '—';
    var d = new Date(t);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { document.body.removeChild(t); }, 300); }, 1800);
  }

  async function copy(text) {
    try {
      if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) {}
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  window.loadList = async function () {
    var secret = document.getElementById('secret').value;
    if (!secret) { toast('请输入密钥', 'no'); return; }
    try {
      var list = await window.YSShareAPI.list(secret);
      ALL_SHARES = list;
      renderTable(list);
      renderSummary(list);
    } catch (e) {
      toast('加载失败：' + (e.message || e), 'no');
    }
  };

  function renderSummary(list) {
    var total = list.length;
    var active = list.filter(function (s) { return s.status === 'active'; }).length;
    var totalActions = list.reduce(function (s, sh) { return s + sh.actionsCount; }, 0);
    var totalViews = list.reduce(function (s, sh) { return s + sh.views; }, 0);
    document.getElementById('summary').innerHTML =
      '<div class="summary-item"><div class="summary-num">' + total + '</div><div class="summary-lbl">总分享</div></div>' +
      '<div class="summary-item"><div class="summary-num">' + active + '</div><div class="summary-lbl">生效中</div></div>' +
      '<div class="summary-item"><div class="summary-num">' + totalViews + '</div><div class="summary-lbl">浏览总数</div></div>' +
      '<div class="summary-item"><div class="summary-num">' + totalActions + '</div><div class="summary-lbl">业主动作</div></div>';
  }

  function renderTable(list) {
    if (!list || list.length === 0) {
      document.getElementById('table-wrap').innerHTML =
        '<div class="empty"><div class="empty-icon">📭</div><div>暂无分享记录</div>' +
        '<div style="margin-top:12px;font-size:13px;">从 app.html 创建报价后，使用「生成分享链接」即可在此看到</div></div>';
      return;
    }
    var rows = '';
    list.forEach(function (s) {
      var actionsHtml = '<div class="actions-cell">' +
        '<button class="btn btn-icon btn-secondary" data-cp="' + s.shareId + '">📋 复制</button>' +
        '<button class="btn btn-icon btn-success" data-qr="' + s.shareId + '">📱 二维码</button>' +
        '<button class="btn btn-icon btn-secondary" data-dt="' + s.shareId + '">📝 详情</button>' +
        '<button class="btn btn-icon btn-danger" data-rm="' + s.shareId + '">🗑 撤销</button>' +
        '</div>';
      rows += '<tr>' +
        '<td><span class="share-id">' + s.shareId + '</span></td>' +
        '<td>' + escapeHtml(s.customer || '—') + '</td>' +
        '<td><strong>¥ ' + fmt(s.estimateAmount) + '</strong></td>' +
        '<td><span class="badge ' + s.status + '">' + (s.status === 'active' ? '生效中' : '已过期') + '</span></td>' +
        '<td>' + s.views + '</td>' +
        '<td><span class="badge actions">' + s.actionsCount + ' 个动作</span></td>' +
        '<td>' + fmtDate(s.createdAt) + '</td>' +
        '<td>' + fmtDate(s.expiresAt) + '</td>' +
        '<td>' + actionsHtml + '</td>' +
        '</tr>';
    });
    document.getElementById('table-wrap').innerHTML = '<table>' +
      '<thead><tr><th>分享ID</th><th>业主</th><th>金额</th><th>状态</th><th>浏览</th><th>动作</th><th>创建时间</th><th>过期时间</th><th>操作</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
    // bind handlers
    document.querySelectorAll('[data-cp]').forEach(function (b) {
      b.onclick = async function () {
        var url = location.origin + location.pathname.replace(/\/[^\/]*$/, '/') + 'share-view.html?shareId=' + b.dataset.cp;
        var ok = await copy(url);
        toast(ok ? '已复制到剪贴板' : '复制失败', ok ? 'ok' : 'no');
      };
    });
    document.querySelectorAll('[data-qr]').forEach(function (b) {
      b.onclick = function () { showQRModal(b.dataset.qr); };
    });
    document.querySelectorAll('[data-dt]').forEach(function (b) {
      b.onclick = function () { showDetailModal(b.dataset.dt); };
    });
    document.querySelectorAll('[data-rm]').forEach(function (b) {
      b.onclick = async function () {
        if (!confirm('确定撤销此分享吗？业主将无法再访问。')) return;
        var secret = document.getElementById('secret').value;
        try {
          await window.YSShareAPI.remove(b.dataset.rm, secret);
          toast('已撤销', 'ok');
          loadList();
        } catch (e) {
          toast('撤销失败：' + (e.message || e), 'no');
        }
      };
    });
  }

  function showQRModal(shareId) {
    var url = location.origin + location.pathname.replace(/\/[^\/]*$/, '/') + 'share-view.html?shareId=' + shareId;
    var r = window.YSQR.render(url, { scale: 6, margin: 4 });
    var modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.onclick = function (e) { if (e.target === modal) document.body.removeChild(modal); };
    var box = document.createElement('div');
    box.className = 'modal';
    box.style.textAlign = 'center';
    box.innerHTML = '<h2>📱 业主扫码查看</h2>' +
      '<div style="display:flex;justify-content:center;margin:16px 0;"></div>' +
      '<div style="word-break:break-all;font-size:12px;color:#666;background:#f5f5f5;padding:10px;border-radius:6px;">' + url + '</div>' +
      '<div class="modal-actions"><button class="btn btn-primary">关闭</button></div>';
    modal.appendChild(box);
    box.querySelector('div div div, .modal div div').textContent;
    // safer: append canvas into the first div under header
    box.children[1].appendChild(r.canvas);
    box.querySelector('.modal-actions .btn').onclick = function () { document.body.removeChild(modal); };
    document.body.appendChild(modal);
  }

  async function showDetailModal(shareId) {
    try {
      var rec = await window.YSShareAPI.get(shareId);
      var modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.onclick = function (e) { if (e.target === modal) document.body.removeChild(modal); };
      var rows = '<div class="modal-row"><strong>分享ID：</strong>' + rec.shareId + '</div>' +
        '<div class="modal-row"><strong>业主：</strong>' + escapeHtml(rec.customerFields?.name || '—') + '</div>' +
        '<div class="modal-row"><strong>金额：</strong>¥ ' + fmt(rec.estimateAmount) + '</div>' +
        '<div class="modal-row"><strong>类型：</strong>' + rec.accessType + '</div>' +
        '<div class="modal-row"><strong>创建：</strong>' + fmtDate(rec.createdAt) + '</div>' +
        '<div class="modal-row"><strong>过期：</strong>' + fmtDate(rec.expiresAt) + '</div>' +
        '<div class="modal-row"><strong>动作数：</strong>' + (rec.actions || []).length + '</div>';
      if (rec.actions && rec.actions.length > 0) {
        rows += '<h3 style="margin:16px 0 8px;color:#C04851;font-size:14px;">📝 动作记录</h3>';
        rec.actions.forEach(function (a, i) {
          rows += '<div class="modal-row">' +
            '<strong>[' + (i + 1) + '] ' + a.type + '</strong> · ' + escapeHtml(a.customerName || '') +
            ' · ' + fmtDate(a.timestamp) +
            (a.reason ? '<div style="margin-top:4px;font-size:12px;color:#666;">理由：' + escapeHtml(a.reason) + '</div>' : '') +
            (a.text ? '<div style="margin-top:4px;font-size:12px;color:#666;">留言：' + escapeHtml(a.text) + '</div>' : '') +
            '</div>';
        });
      }
      var box = document.createElement('div');
      box.className = 'modal';
      box.innerHTML = '<h2>📝 分享详情</h2>' + rows +
        '<div class="modal-actions"><button class="btn btn-primary">关闭</button></div>';
      modal.appendChild(box);
      box.querySelector('.btn').onclick = function () { document.body.removeChild(modal); };
      document.body.appendChild(modal);
    } catch (e) {
      toast('加载详情失败：' + (e.message || e), 'no');
    }
  }

  window.exportCSV = function () {
    if (!ALL_SHARES.length) { toast('暂无数据可导出', 'no'); return; }
    var headers = ['shareId', '业主', '报价金额', '状态', '浏览次数', '动作数', '创建时间', '过期时间'];
    var csv = headers.join(',') + '\n';
    ALL_SHARES.forEach(function (s) {
      csv += [
        s.shareId,
        '"' + (s.customer || '').replace(/"/g, '""') + '"',
        s.estimateAmount,
        s.status,
        s.views,
        s.actionsCount,
        s.createdAt ? new Date(s.createdAt).toISOString() : '',
        s.expiresAt ? new Date(s.expiresAt).toISOString() : ''
      ].join(',') + '\n';
    });
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'shares-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已导出 CSV', 'ok');
  };

  window.runGC = async function () {
    try {
      var n = await window.YSShareAPI.runGC();
      toast('已清理 ' + n + ' 条过期记录', 'ok');
      loadList();
    } catch (e) {
      toast('清理失败：' + (e.message || e), 'no');
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadList);
  } else {
    loadList();
  }
})();
</script>
</body>
</html>
