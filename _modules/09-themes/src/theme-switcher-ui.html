<!DOCTYPE html>
<!-- theme-switcher-ui.html — 独立组件（主题切换 UI）
     用法：引入 theme-palettes.js + theme-controller.js + 4 CSS 后，
           YSTheme.attachThemeSwitcher('#theme-area') 即可。
     持久化：localStorage 4 个键（color_mode / light_skin / density / glass） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>主题切换器 — 6 主题 × 4 维</title>
<link rel="stylesheet" href="theme-vars.css">
<link rel="stylesheet" href="theme-modes.css">
<link rel="stylesheet" href="theme-density.css">
<link rel="stylesheet" href="theme-glass.css">
<style>
  /* 切换器本身的小样式（不属于核心主题 — 仅 UI） */
  .ys-theme-switcher {
    background: var(--ys-chrome);
    color: var(--ys-ink);
    border: 1px solid var(--ys-line);
    border-radius: 6px;
    padding: 12px;
    width: 280px;
    font-size: 13px;
  }
  .ys-theme-switcher .ys-ts-title {
    font-size: 11px;
    color: var(--ys-muted);
    margin: 8px 0 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ys-theme-switcher .ys-ts-palette {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .ys-theme-switcher .ys-ts-swatch {
    --c: #888;
    border: 2px solid transparent;
    border-radius: 4px;
    padding: 4px 2px;
    background: var(--ys-bg);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: border-color 200ms ease, transform 100ms ease;
  }
  .ys-theme-switcher .ys-ts-swatch:hover { transform: translateY(-1px); }
  .ys-theme-switcher .ys-ts-swatch.ys-ts-active {
    border-color: var(--c);
    box-shadow: 0 0 0 1px var(--c);
  }
  .ys-theme-switcher .ys-ts-dot {
    width: 16px; height: 16px;
    background: var(--c);
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.1);
  }
  .ys-theme-switcher .ys-ts-name { font-size: 10px; color: var(--ys-ink); }

  .ys-theme-switcher .ys-ts-mode,
  .ys-theme-switcher .ys-ts-density {
    display: flex; gap: 4px; margin-bottom: 8px;
  }
  .ys-theme-switcher .ys-ts-mode button,
  .ys-theme-switcher .ys-ts-density button,
  .ys-theme-switcher .ys-ts-save {
    flex: 1;
    padding: 4px 8px;
    background: var(--ys-bg);
    color: var(--ys-ink);
    border: 1px solid var(--ys-line);
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
  }
  .ys-theme-switcher button.ys-ts-active {
    background: var(--ys-accent);
    color: var(--ys-on-accent);
    border-color: var(--ys-accent);
  }
  .ys-theme-switcher .ys-ts-save { flex: 1; background: var(--ys-accent); color: var(--ys-on-accent); border-color: var(--ys-accent); }
  .ys-theme-switcher .ys-ts-save:hover { filter: brightness(0.92); }

  /* 预览面板 — 实时展示当前主题 */
  .ys-preview {
    margin-top: 16px;
    padding: 12px;
    background: var(--ys-chrome);
    border: 1px solid var(--ys-line);
    border-radius: 4px;
    width: 280px;
  }
  .ys-preview h3 { margin: 0 0 8px; font-size: 13px; }
  .ys-preview .ys-prev-card {
    background: var(--ys-accent-soft);
    border-left: 3px solid var(--ys-accent);
    padding: 8px;
    margin-bottom: 4px;
    color: var(--ys-ink);
    font-size: 12px;
  }
</style>
</head>
<body data-mode="light" data-density="standard" data-glass="false">
  <h2>主题切换器（36 组合 = 6 色 × 2 模式 × 3 密度）</h2>
  <div id="theme-area"></div>
  <div class="ys-preview" id="preview">
    <h3>实时预览</h3>
    <div class="ys-prev-card">示例卡片 1 — accent 强调色（财务字段联动）</div>
    <div class="ys-prev-card">示例卡片 2 — 主题色与文字的对比度</div>
    <div class="ys-prev-card">示例卡片 3 — 玻璃效果与密度切换</div>
  </div>

  <script src="theme-palettes.js"></script>
  <script src="theme-controller.js"></script>
  <script>
    // ---- 演示用法 ----
    // 1. 注入主题切换器
    YSTheme.attachThemeSwitcher(document.getElementById('theme-area'));

    // 2. 财务字段联动（module 06 风格的费率输入框）
    YSTheme.bindAccentToInputs('[data-ys-fee]');

    // 3. 实时预览同步（可选 — 切换器本身已通过 _syncSwitcherUI 同步）
    document.addEventListener('click', function () {
      var cur = YSTheme.getCurrent();
      document.body.setAttribute('data-mode',    cur.mode);
      document.body.setAttribute('data-density', cur.density);
      document.body.setAttribute('data-glass',   cur.glass ? 'true' : 'false');
    }, true);

    // 4. 控制台输出 36 组合矩阵
    console.log('[theme-switcher-ui] 36 组合 =', YSTheme.getAllCombinations().length, '种');
    console.log('[theme-switcher-ui] 当前 =', YSTheme.getCurrent());
  </script>
</body>
</html>
