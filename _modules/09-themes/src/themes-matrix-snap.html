<!DOCTYPE html>
<!-- themes-matrix-snap.html — 36 组合全展示（6 色 × 2 模式 × 3 密度）
     用法：打开此页面即可看到全部 36 组合的预览 + 点击某 cell 全屏应用
     36 = 6 color × 2 mode × 3 density（glass 单独维度不计入）
     与 REF 持久化键 100% 对齐：ys_cloud_light_skin_v1 / ys_studio_ui_v31_color_mode / ys_studio_ui_v31_density -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>36 主题组合矩阵 — yunshu-zhuangqi</title>
<link rel="stylesheet" href="theme-vars.css">
<link rel="stylesheet" href="theme-modes.css">
<link rel="stylesheet" href="theme-density.css">
<link rel="stylesheet" href="theme-glass.css">
<style>
  body {
    padding: 24px;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    transition: background 200ms ease, color 200ms ease;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  .ys-note { color: var(--ys-muted); font-size: 12px; margin-bottom: 16px; }

  .ys-matrix-wrap {
    overflow-x: auto;
    border: 1px solid var(--ys-line);
    border-radius: 6px;
    background: var(--ys-chrome);
  }
  .ys-matrix {
    display: grid;
    grid-template-columns: 110px repeat(3, 1fr);  /* 1 标题 + 3 密度列 */
    grid-template-rows: repeat(6, 140px);           /* 6 主题行 */
    min-width: 800px;
  }
  .ys-matrix > div {
    border-right: 1px solid var(--ys-line);
    border-bottom: 1px solid var(--ys-line);
    padding: 8px;
    display: flex; flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }
  .ys-matrix .ys-m-head {
    background: var(--ys-bg);
    font-weight: 600;
    font-size: 11px;
    color: var(--ys-muted);
    text-align: center;
    align-items: center;
    justify-content: center;
    border-bottom: 2px solid var(--ys-line);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .ys-matrix .ys-m-corner {
    background: var(--ys-bg);
    border-bottom: 2px solid var(--ys-line);
  }
  .ys-matrix .ys-m-row-label {
    background: var(--ys-bg);
    font-weight: 600;
    align-items: flex-start;
  }
  .ys-matrix .ys-m-row-label .ys-m-swatch {
    width: 100%;
    height: 12px;
    background: var(--c);
    border-radius: 2px;
    margin-bottom: 4px;
  }
  .ys-matrix .ys-m-row-label .ys-m-name {
    font-size: 13px;
    color: var(--ys-ink);
  }
  .ys-matrix .ys-m-row-label .ys-m-hex {
    font-size: 10px;
    color: var(--ys-muted);
    font-family: monospace;
  }

  /* 每个 cell 内部预览 */
  .ys-m-cell {
    cursor: pointer;
    position: relative;
    transition: transform 100ms ease;
  }
  .ys-m-cell:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px var(--c); }
  .ys-m-cell .ys-m-mode-label {
    font-size: 10px;
    color: var(--ys-muted);
    position: absolute;
    top: 4px; right: 4px;
  }
  .ys-m-cell .ys-m-bar {
    height: 4px;
    background: var(--c);
    border-radius: 2px;
    margin: 16px 0 4px;
  }
  .ys-m-cell .ys-m-text {
    font-size: 11px;
    color: var(--ys-ink);
    line-height: 1.4;
  }
  .ys-m-cell .ys-m-text strong {
    color: var(--c);
  }
  .ys-m-cell .ys-m-btn {
    background: var(--c);
    color: var(--ys-on-accent, #fff);
    border: none;
    padding: 2px 6px;
    border-radius: 2px;
    font-size: 10px;
    margin-top: 4px;
    align-self: flex-start;
    cursor: pointer;
  }

  /* 全屏应用遮罩 */
  .ys-full-overlay {
    position: fixed; inset: 0;
    background: var(--ys-bg);
    color: var(--ys-ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 32px;
    text-align: center;
  }
  .ys-full-overlay h2 { font-size: 32px; margin-bottom: 16px; color: var(--ys-accent); }
  .ys-full-overlay .ys-full-meta { font-size: 14px; color: var(--ys-muted); margin-bottom: 24px; font-family: monospace; }
  .ys-full-overlay button {
    background: var(--ys-accent);
    color: var(--ys-on-accent, #fff);
    border: none;
    padding: 10px 24px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  /* 顶部工具条 */
  .ys-bar {
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .ys-bar select, .ys-bar button {
    padding: 6px 12px;
    border: 1px solid var(--ys-line);
    background: var(--ys-chrome);
    color: var(--ys-ink);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body data-mode="light" data-density="standard" data-glass="false">
  <h1>36 主题组合矩阵</h1>
  <p class="ys-note">
    <strong>36 = 6 color × 2 mode × 3 density</strong>
    &nbsp;·&nbsp; 行 = 主题色 &nbsp;·&nbsp; 列 = 密度（紧凑/标准/宽松） &nbsp;·&nbsp; 每个 cell 内分浅/深 2 段
    &nbsp;·&nbsp; 点击 cell 全屏应用该组合
  </p>

  <div class="ys-bar">
    <span>玻璃：</span>
    <button id="btn-glass-off">关闭</button>
    <button id="btn-glass-on">开启</button>
    <span style="margin-left: 24px;">切换器：</span>
    <button id="btn-switcher">主题切换器</button>
  </div>

  <div id="theme-area"></div>

  <div class="ys-matrix-wrap">
    <div class="ys-matrix" id="matrix"></div>
  </div>

  <script src="theme-palettes.js"></script>
  <script src="theme-controller.js"></script>
  <script>
    'use strict';

    // ---- 辅助：构建 cell 内部双段（浅/深）预览 ----
    var THEMES = window.YS_THEMES;
    var WHITE = YSTheme.WHITE_THEME;   // ['red','navy','turquoise','ochre','purple','lilac']
    var DENS = YSTheme.WHITE_DENS;     // ['compact','standard','loose']
    var MODES = YSTheme.WHITE_MODE;    // ['light','dark']

    var matrix = document.getElementById('matrix');

    // ---- 头部（密度列名） ----
    matrix.appendChild(_cell('div', 'ys-m-corner ys-m-head', '主题 \\ 密度'));
    DENS.forEach(function (d) {
      var h = _cell('div', 'ys-m-head', d.toUpperCase());
      matrix.appendChild(h);
    });

    // ---- 主体 6 行 × 3 列 ----
    WHITE.forEach(function (colorKey) {
      var t = THEMES[colorKey];
      // 行头（色块 + 名称 + hex）
      var labelEl = document.createElement('div');
      labelEl.className = 'ys-m-row-label';
      labelEl.style.setProperty('--c', t.primary);
      labelEl.innerHTML =
        '<span class="ys-m-swatch"></span>' +
        '<span class="ys-m-name">' + t.name + ' (' + colorKey + ')</span>' +
        '<span class="ys-m-hex">' + t.primary + '</span>';
      matrix.appendChild(labelEl);

      // 3 列
      DENS.forEach(function (density) {
        var cell = document.createElement('div');
        cell.className = 'ys-m-cell';
        cell.setAttribute('data-color',   colorKey);
        cell.setAttribute('data-density', density);
        cell.style.setProperty('--c', t.primary);

        // 内部分两段：上半浅色、下半深色
        var lightHTML =
          '<span class="ys-m-mode-label">浅色</span>' +
          '<div class="ys-m-bar"></div>' +
          '<div class="ys-m-text"><strong>' + t.name + '</strong> · ' + density + '</div>' +
          '<button class="ys-m-btn">示例按钮</button>';
        var darkHTML =
          '<span class="ys-m-mode-label">深色</span>' +
          '<div class="ys-m-bar"></div>' +
          '<div class="ys-m-text"><strong>' + t.name + '</strong> · ' + density + '</div>' +
          '<button class="ys-m-btn">示例按钮</button>';

        cell.innerHTML =
          '<div style="flex:1;background:#fafafa;color:#1a1a1a;padding:6px;border-radius:3px 3px 0 0;">' + lightHTML + '</div>' +
          '<div style="flex:1;background:#1a1f1c;color:#f0f0f0;padding:6px;border-radius:0 0 3px 3px;">' + darkHTML + '</div>';
        cell.addEventListener('click', function () {
          applyFullscreen(colorKey, density);
        });
        matrix.appendChild(cell);
      });
    });

    function _cell(tag, cls, html) {
      var e = document.createElement(tag);
      e.className = cls;
      if (html) e.innerHTML = html;
      return e;
    }

    // ---- 全屏应用某组合 ----
    function applyFullscreen(color, density) {
      var t = THEMES[color];
      // 注入遮罩
      var existing = document.querySelector('.ys-full-overlay');
      if (existing) existing.remove();
      var overlay = document.createElement('div');
      overlay.className = 'ys-full-overlay';
      // 应用 light 模式（默认 — 还原按钮可切换）
      document.body.setAttribute('data-mode', 'light');
      document.body.setAttribute('data-density', density);
      document.body.setAttribute('data-glass', 'false');
      YSTheme.applyAll(color, 'light', false, density);
      overlay.innerHTML =
        '<h2>全屏预览 · ' + t.name + ' / 浅色 / ' + density + '</h2>' +
        '<div class="ys-full-meta">' + color + ' · light · ' + density + ' · ' + t.primary + '</div>' +
        '<button id="restore">还原默认</button>';
      document.body.appendChild(overlay);
      overlay.querySelector('#restore').addEventListener('click', function () {
        overlay.remove();
        YSTheme.applyAll('red', 'light', false, 'standard');
      });
    }

    // ---- 顶部工具条事件 ----
    document.getElementById('btn-glass-off').addEventListener('click', function () { YSTheme.setGlass(false); });
    document.getElementById('btn-glass-on').addEventListener('click', function () { YSTheme.setGlass(true); });
    document.getElementById('btn-switcher').addEventListener('click', function () {
      YSTheme.attachThemeSwitcher(document.getElementById('theme-area'));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ---- 启动时附加主题切换器 ----
    YSTheme.attachThemeSwitcher(document.getElementById('theme-area'));

    // ---- 控制台输出 36 组合 ----
    console.log('[themes-matrix-snap] 36 组合:', YSTheme.getAllCombinations().length, '种');
    console.log('[themes-matrix-snap] 当前:', YSTheme.getCurrent());
  </script>
</body>
</html>
