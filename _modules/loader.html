<script src="_modules/10-share-link/share-api-mock.js" defer></script>
<script src="_modules/10-share-link/share-actions.js" defer></script>

<script>
window.addEventListener('DOMContentLoaded', () => {
  console.log('[R31202 loader] 10 modules loaded');
  // 集成工具栏：右上角加 4 个浮动按钮
  if (document.body && !document.getElementById('r31202-toolbar')) {
    const tb = document.createElement('div');
    tb.id = 'r31202-toolbar';
    tb.style.cssText = 'position:fixed;top:14px;right:14px;z-index:99999;display:flex;flex-direction:column;gap:6px;font-family:system-ui,sans-serif';
    tb.innerHTML = `
      <button data-act="theme" style="padding:8px 12px;background:var(--ys-chrome,#fff);border:1px solid #ccc;border-radius:8px;cursor:pointer;color:var(--ys-ink,#1a1a1a);box-shadow:0 2px 8px rgba(0,0,0,.08)">🎨 主题(36)</button>
      <button data-act="print" style="padding:8px 12px;background:var(--ys-chrome,#fff);border:1px solid #ccc;border-radius:8px;cursor:pointer;color:var(--ys-ink,#1a1a1a);box-shadow:0 2px 8px rgba(0,0,0,.08)">🖨️ 22纸型打印</button>
      <button data-act="spatial" style="padding:8px 12px;background:var(--ys-chrome,#fff);border:1px solid #ccc;border-radius:8px;cursor:pointer;color:var(--ys-ink,#1a1a1a);box-shadow:0 2px 8px rgba(0,0,0,.08)">📐 空间算量</button>
      <button data-act="share" style="padding:8px 12px;background:var(--ys-accent,#A23C43);color:#fff;border:0;border-radius:8px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:600">🅱️ 分享业主</button>
      <button data-act="clone-export" style="padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:8px;cursor:pointer">📦 克隆导出</button>
      <button data-act="clone-import" style="padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:8px;cursor:pointer">📥 克隆导入</button>
      <button data-act="ref-import" style="padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:8px;cursor:pointer">🔄 REF导入</button>
      <button data-act="assistant" style="padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:8px;cursor:pointer">🤖 智能助手</button>
      <button data-act="calendar" style="padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:8px;cursor:pointer">📅 万年历</button>
      <button data-act="fee-summary" style="padding:8px 12px;background:#fff;border:1px solid #ccc;border-radius:8px;cursor:pointer">💰 费率汇总</button>
    `;
    document.body.appendChild(tb);

    tb.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;

      if (act === 'theme') {
        if (window.YSTheme?.attachThemeSwitcher) {
          let ui = document.getElementById('r31202-theme-ui');
          if (ui) { ui.remove(); return; }
          ui = document.createElement('div');
          ui.id = 'r31202-theme-ui';
          ui.style.cssText = 'position:fixed;top:60px;right:14px;z-index:99999;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);min-width:240px;font-family:system-ui';
          ui.innerHTML = '<div style="font-weight:600;margin-bottom:12px">主题 (6×2×3=36)</div>';
          ['red','navy','turquoise','ochre','purple','lilac'].forEach(c => {
            const b = document.createElement('button');
            const t = window.YSTheme?.THEMES?.[c];
            b.textContent = t?.name || c;
            b.style.cssText = `margin:4px;padding:6px 12px;background:${t?.primary || '#ccc'};color:#fff;border:0;border-radius:6px;cursor:pointer`;
            b.onclick = () => { window.YSTheme?.setTheme?.(c); window.YSTheme?.persist?.(); document.body.dataset.mode = localStorage.getItem('ys_studio_ui_v31_color_mode') || 'light'; };
            ui.appendChild(b);
          });
          const dm = document.createElement('button');
          dm.textContent = '🌞/🌙';
          dm.style.cssText = 'margin:4px;padding:6px 12px;background:#333;color:#fff;border:0;border-radius:6px;cursor:pointer;display:block;width:100%';
          dm.onclick = () => { const cur = localStorage.getItem('ys_studio_ui_v31_color_mode') || 'light'; window.YSTheme?.setMode?.(cur === 'dark' ? 'light' : 'dark'); window.YSTheme?.persist?.(); location.reload(); };
          ui.appendChild(dm);
          document.body.appendChild(ui);
        } else alert('Module 09 主题未加载，请刷新页面');
      }

      else if (act === 'print') {
        const data = (typeof data !== 'undefined') ? data : {};
        window.open('_modules/02-print-preview/print-preview.html?data=' + btoa(unescape(encodeURIComponent(JSON.stringify(data || {})))));
      }

      else if (act === 'spatial') {
        window.open('_modules/05-spatial/spatial.html', '_blank', 'width=1200,height=800');
      }

      else if (act === 'share' && window.YSShare) {
        window.YSShare.create({
          projectData: (typeof data !== 'undefined' ? data : { projectInfo: { name: '示范工程', companyName: '漳州装修工作室' } }),
          estimateAmount: 125600,
          accessType: 'public-read',
          expiresIn: 7 * 24 * 60 * 60 * 1000,
          customerFields: { name: '', phone: '', note: '' }
        });
      }

      else if (act === 'clone-export' && window.YSClone) {
        const settings = JSON.parse(localStorage.getItem('rm_persistent_settings_v23') || '{}');
        const library = JSON.parse(localStorage.getItem('ys_system_quota_library_v1') || '{}');
        const template = JSON.parse(localStorage.getItem('rm_template_data') || null);
        const preferences = {
          ys_studio_ui_v31_density: localStorage.getItem('ys_studio_ui_v31_density'),
          ys_studio_ui_v31_color_mode: localStorage.getItem('ys_studio_ui_v31_color_mode'),
          ys_cloud_light_skin_v1: localStorage.getItem('ys_cloud_light_skin_v1'),
          'ys-almanac-display-v1': localStorage.getItem('ys-almanac-display-v1'),
          smart_quota_sources: localStorage.getItem('smart_quota_sources')
        };
        try {
          const bytes = await window.YSClone.exportBytes(settings, library, template, preferences, []);
          const blob = new Blob([bytes], { type: 'application/zip' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = (settings.companyName || '报价系统') + '_克隆配置_' + Date.now() + '.zip';
          a.click();
        } catch (e) { alert('克隆导出失败：' + e.message); }
      }

      else if (act === 'clone-import' && window.YSClone) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.zip';
        input.onchange = async () => {
          const f = input.files[0];
          if (!f) return;
          try {
            const buf = new Uint8Array(await f.arrayBuffer());
            const parsed = await window.YSClone.inspect(buf);
            if (!confirm('导入 ' + parsed.manifest.company + '？')) return;
            await window.YSClone.apply(parsed.config);
            location.reload();
          } catch (e) { alert('克隆导入失败：' + e.message); }
        };
        input.click();
      }

      else if (act === 'ref-import') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.bjproj,.bjchange,.wlbook,.json';
        input.onchange = async () => {
          const f = input.files[0];
          if (!f) return;
          try {
            const text = await f.text();
            if (f.name.endsWith('.bjproj') || f.name.includes('project')) {
              const data = window.YSRefReverse?.parseRefBjproj?.(text) || window.parseBjproj?.(text);
              if (data) { Object.assign((typeof data !== 'undefined' ? data : window.ydata), data); alert('REF 报价导入成功'); }
            }
            else if (f.name.endsWith('.bjchange')) {
              const rows = window.YSRefReverse?.parseRefBjchange?.(text) || window.parseBjchange?.(text);
              if (rows && typeof data !== 'undefined') { data.changeOrders = rows; alert('增减项导入成功'); }
            }
            else alert('已导入但需手动激活');
          } catch (e) { alert('REF 导入失败：' + e.message); }
        };
        input.click();
      }

      else if (act === 'assistant') {
        window.open('_modules/07-assistant/assistant.html', '_blank', 'width=1100,height=800');
      }

      else if (act === 'calendar') {
        window.open('_modules/08-calendar/calendar-ui.html', '_blank', 'width=900,height=700');
      }

      else if (act === 'fee-summary') {
        window.open('_modules/06-material-calc/src/fee-summary.html', '_blank', 'width=800,height=600');
      }
    });
  }

  // 08 万年历 · 自动挂载到顶部日期区域
  setTimeout(() => {
    const dateBox = document.querySelector('[class*="date"], [id*="date"], .today, .ys-today');
    if (dateBox && window.YSCalendarWidget) {
      try { window.YSCalendarWidget.mount(dateBox); } catch (e) { /* swallow */ }
    }
  }, 1500);

  // 09 主题 · 应用持久化值
  if (window.YSTheme?.loadFromStorage) {
    setTimeout(() => window.YSTheme.loadFromStorage(), 500);
  }
});
</script>
