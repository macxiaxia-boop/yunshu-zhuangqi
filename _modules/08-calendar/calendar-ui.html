<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>万年历 — yunshu-zhuangqi</title>
<style>
  :root { --accent:#A23C43; --bg:#fafafa; --cell:#fff; --weekend:#f4f0ea; --holiday-rest:#fde7e9; --work-swap:#e6f4ea; --today:#fff7d1; --cell-border:#e5e5e5; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,"Microsoft Yahei",sans-serif;background:var(--bg);color:#222}
  header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
  header .title{font-size:18px;font-weight:600;margin-right:8px}
  header .date-now{color:#666;font-size:13px;margin-right:auto}
  header .btn{appearance:none;border:1px solid #ddd;background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
  header .btn:hover{background:#f1f1f1}
  header .picker{display:flex;gap:4px;align-items:center}
  header .picker input{width:80px;padding:4px 6px;border:1px solid #ccc;border-radius:4px;font:inherit}
  .legend{padding:8px 16px;font-size:12px;display:flex;gap:14px;color:#666;background:#fff;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--cell-border)}
  .legend .lg-rest{background:var(--holiday-rest)} .legend .lg-work{background:var(--work-swap)} .legend .lg-today{background:var(--today)}
  main{padding:12px 16px}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#e5e5e5;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden}
  .month-grid .hd{background:#f0f0f0;padding:6px 0;text-align:center;font-weight:600;font-size:13px}
  .month-grid .hd.we{color:#c0392b}
  .month-grid .cell{background:var(--cell);min-height:92px;padding:5px 6px;display:flex;flex-direction:column;gap:2px;cursor:pointer;position:relative}
  .month-grid .cell.we{background:var(--weekend)}
  .month-grid .cell.rest{background:var(--holiday-rest)}
  .month-grid .cell.work{background:var(--work-swap)}
  .month-grid .cell.other{opacity:.35;background:#f7f7f7}
  .month-grid .cell.today{outline:2px solid var(--accent);outline-offset:-2px}
  .month-grid .cell .solar{font-size:16px;font-weight:600;line-height:1}
  .month-grid .cell .solar small{font-size:11px;color:#999;margin-left:3px;font-weight:normal}
  .month-grid .cell .lunar{font-size:11px;color:#8a6d3b}
  .month-grid .cell .ganzhi{font-size:10.5px;color:#506680}
  .month-grid .cell .tag{display:inline-block;font-size:10px;padding:1px 4px;border-radius:3px;background:rgba(192,57,43,.12);color:#c0392b;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .month-grid .cell .tag.swap{background:rgba(34,139,34,.15);color:#228b22}
  .month-grid .cell .jieqi{font-size:10px;color:#d4691b;font-weight:600}
  .month-grid .empty{background:#f7f7f7;cursor:default}
  .detail-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
  .detail{background:#fff;border-radius:8px;padding:20px 24px;max-width:520px;width:90vw;max-height:84vh;overflow:auto;box-shadow:0 12px 48px rgba(0,0,0,.25)}
  .detail h3{margin:0 0 8px;font-size:18px;color:var(--accent)}
  .detail table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
  .detail table td{padding:5px 8px;border-bottom:1px dashed #eee;vertical-align:top}
  .detail table td.k{color:#888;width:90px}
  .detail .close{position:absolute;top:8px;right:12px;border:0;background:transparent;font-size:20px;cursor:pointer;color:#999}
  .detail .yi,.detail .ji{display:flex;flex-wrap:wrap;gap:4px}
  .detail .yi span,.detail .ji span{font-size:12px;padding:2px 6px;border-radius:10px;background:#f0f0f0}
  .detail .yi span{background:rgba(34,139,34,.12);color:#228b22}
  .detail .ji span{background:rgba(192,57,43,.12);color:#c0392b}
  .hint{padding:10px 16px;font-size:12px;color:#888}
</style>
</head>
<body>
<header>
  <div class="title">📅 万年历</div>
  <div class="date-now" id="dateNow">--</div>
  <div class="picker">
    <label>年 <input type="number" id="inYear" min="1900" max="2100"></label>
    <label>月 <input type="number" id="inMonth" min="1" max="12"></label>
    <button class="btn" id="btnGo">跳转</button>
    <button class="btn" id="btnToday">回到今天</button>
    <button class="btn" id="btnPrevYear">« 年</button>
    <button class="btn" id="btnPrevMon">‹ 月</button>
    <button class="btn" id="btnNextMon">月 ›</button>
    <button class="btn" id="btnNextYear">年 »</button>
  </div>
</header>
<div class="legend">
  <span><i class="lg-rest"></i> 法定节假日 / 休息日</span>
  <span><i class="lg-work"></i> 调休补班</span>
  <span><i class="lg-today"></i> 今天</span>
  <span>键盘: ← → 切月 · ↑ ↓ 切年 · Esc 关闭</span>
</div>
<main>
  <div class="month-grid" id="grid"></div>
  <div class="hint">点击某天查看详情 · 1900 — 2100 年范围</div>
</main>

<script src="./vendor/lunar.min.js"></script>
<script src="./calendar.js"></script>
<script src="./calendar-store.js"></script>
<script>
(function () {
  'use strict';

  var today = new Date();
  var curY = today.getFullYear();
  var curM = today.getMonth() + 1;
  var viewY = curY;
  var viewM = curM;

  var inYear = document.getElementById('inYear');
  var inMonth = document.getElementById('inMonth');
  var grid = document.getElementById('grid');
  var dateNow = document.getElementById('dateNow');
  var mask = null;

  function fmtMonthHeader() { return viewY + ' 年 ' + viewM + ' 月'; }
  function updateHeaderText() {
    dateNow.textContent = '今天: ' + YSCalendar.formatTodayCN(today);
    document.title = '万年历 ' + fmtMonthHeader();
  }

  function daysInMonth(y, m) {
    if (m === 2) {
      var leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
      return leap ? 29 : 28;
    }
    return [31,28,31,30,31,30,31,31,30,31,30,31][m - 1];
  }

  function firstWeekday(y, m) {
    return new Date(y, m - 1, 1).getDay();
  }

  function classForCell(d, y, m, isToday) {
    var info = YSCalendar.getLunarInfo(d);
    var cls = ['cell'];
    if (isToday) cls.push('today');
    if (info.workStatus === 'rest') cls.push('rest');
    if (info.workStatus === 'work') cls.push('work');
    if (d.getDay() === 0 || d.getDay() === 6) cls.push('we');
    if (d.getFullYear() !== y || (d.getMonth() + 1) !== m) cls.push('other');
    return { cls: cls.join(' '), info: info };
  }

  function render() {
    inYear.value = viewY;
    inMonth.value = viewM;
    var html = [];
    var HDR = ['周日','周一','周二','周三','周四','周五','周六'];
    for (var i = 0; i < 7; i++) {
      html.push('<div class="hd' + (i === 0 || i === 6 ? ' we' : '') + '">' + HDR[i] + '</div>');
    }

    var firstDay = firstWeekday(viewY, viewM);
    var dim = daysInMonth(viewY, viewM);

    // 上一月补格
    for (var p = 0; p < firstDay; p++) {
      var py = viewY;
      var pm = viewM - 1;
      if (pm < 1) { pm = 12; py--; }
      var pd = daysInMonth(py, pm) - (firstDay - 1 - p);
      var pdDate = new Date(py, pm - 1, pd);
      var pobj = classForCell(pdDate, viewY, viewM, false);
      html.push(buildCell(pdDate, pobj.info, pd, true));
    }
    // 本月
    for (var d = 1; d <= dim; d++) {
      var dDate = new Date(viewY, viewM - 1, d);
      var isToday = dDate.getFullYear() === curY && dDate.getMonth() === curM - 1 && dDate.getDate() === today.getDate() && viewY === curY && viewM === curM;
      var obj = classForCell(dDate, viewY, viewM, isToday);
      html.push(buildCell(dDate, obj.info, d, false));
    }
    // 下一月补格
    var totalCells = firstDay + dim;
    var tail = (7 - (totalCells % 7)) % 7;
    for (var q = 1; q <= tail; q++) {
      var ny = viewY;
      var nm = viewM + 1;
      if (nm > 12) { nm = 1; ny++; }
      var nDate = new Date(ny, nm - 1, q);
      var nobj = classForCell(nDate, viewY, viewM, false);
      html.push(buildCell(nDate, nobj.info, q, true));
    }
    grid.innerHTML = html.join('');
  }

  function buildCell(dDate, info, dnum, other) {
    var lunarText = info.lunar;
    if (lunarText.indexOf('初一') === 2 && lunarText.length > 2) {
      // 月份首日用月份名 (例:九月)
      lunarText = lunarText.slice(0, 2);
    }
    var tag = '';
    if (info.holiday) {
      tag = '<span class="tag' + (info.workStatus === 'work' ? ' swap' : '') + '">' +
        info.holiday + (info.workStatus === 'work' ? '(补)' : '') + '</span>';
    }
    var jieqiHtml = info.jieqi ? '<div class="jieqi">· ' + info.jieqi + ' ·</div>' : '';
    var ganzhiHtml = info.ganzhiMonth && info.ganzhiDay ? ('<div class="ganzhi">' + info.ganzhiMonth + '月 ' + info.ganzhiDay + '日</div>') : '';
    var solarHtml = '<div class="solar">' + dnum + '<small>' + ['日','一','二','三','四','五','六'][dDate.getDay()] + '</small></div>';
    return '<div class="' + info.__cls + '" data-iso="' + dDate.toISOString().slice(0, 10) + '">' +
      solarHtml +
      '<div class="lunar">' + lunarText + '</div>' +
      ganzhiHtml +
      jieqiHtml +
      tag +
      '</div>';
  }

  // Cell click → detail
  grid.addEventListener('click', function (e) {
    var el = e.target.closest('.cell');
    if (!el) return;
    var iso = el.getAttribute('data-iso');
    if (!iso) return;
    openDetail(iso);
  });

  function openDetail(iso) {
    var parts = iso.split('-');
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    var info = YSCalendar.getLunarInfo(d);
    var wkCn = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    var yiHtml = (info.yi || []).slice(0, 12).map(function (s) { return '<span>' + s + '</span>'; }).join('');
    var jiHtml = (info.ji || []).slice(0, 12).map(function (s) { return '<span>' + s + '</span>'; }).join('');
    var html = '<div class="detail">' +
      '<button class="close" id="dClose" aria-label="关闭">×</button>' +
      '<h3>' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' + wkCn + '</h3>' +
      '<table>' +
      '<tr><td class="k">公历</td><td>' + d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · ' + wkCn + '</td></tr>' +
      '<tr><td class="k">农历</td><td>' + info.lunarYear + ' · ' + info.lunar + (info.workStatus === 'work' ? ' (调休补班)' : (info.workStatus === 'rest' ? ' (休息)' : '')) + '</td></tr>' +
      '<tr><td class="k">干支</td><td>' + (info.ganzhi || '') + '</td></tr>' +
      '<tr><td class="k">生肖</td><td>' + info.shengxiao + '年</td></tr>' +
      (info.jieqi ? '<tr><td class="k">节气</td><td>' + info.jieqi + '</td></tr>' : '') +
      (info.holiday ? '<tr><td class="k">节假日</td><td>' + info.holiday + '</td></tr>' : '') +
      '<tr><td class="k">宜</td><td><div class="yi">' + (yiHtml || '—') + '</div></td></tr>' +
      '<tr><td class="k">忌</td><td><div class="ji">' + (jiHtml || '—') + '</div></td></tr>' +
      '</table></div>';
    if (mask) mask.remove();
    mask = document.createElement('div');
    mask.className = 'detail-mask';
    mask.innerHTML = html;
    document.body.appendChild(mask);
    var closer = function () { if (mask) mask.remove(); mask = null; };
    mask.addEventListener('click', function (e) {
      if (e.target === mask) closer();
    });
    document.getElementById('dClose').addEventListener('click', closer);
  }

  function shift(deltaY, deltaM) {
    viewM += deltaM;
    while (viewM < 1) { viewM += 12; viewY--; }
    while (viewM > 12) { viewM -= 12; viewY++; }
    viewY += deltaY;
    if (viewY < 1900) viewY = 1900;
    if (viewY > 2100) viewY = 2100;
    render();
  }

  document.getElementById('btnPrevMon').addEventListener('click', function () { shift(0, -1); render(); });
  document.getElementById('btnNextMon').addEventListener('click', function () { shift(0,  1); render(); });
  document.getElementById('btnPrevYear').addEventListener('click', function () { shift(-1, 0); render(); });
  document.getElementById('btnNextYear').addEventListener('click', function () { shift( 1, 0); render(); });
  document.getElementById('btnToday').addEventListener('click', function () { viewY = curY; viewM = curM; render(); });
  document.getElementById('btnGo').addEventListener('click', function () {
    var y = parseInt(inYear.value, 10);
    var m = parseInt(inMonth.value, 10);
    if (isNaN(y) || y < 1900 || y > 2100) { alert('年份需 1900-2100'); return; }
    if (isNaN(m) || m < 1 || m > 12) { alert('月份需 1-12'); return; }
    viewY = y; viewM = m; render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && mask) { mask.remove(); mask = null; return; }
    if (mask) return;
    if (e.key === 'ArrowLeft')  { shift(0, -1); render(); }
    else if (e.key === 'ArrowRight') { shift(0,  1); render(); }
    else if (e.key === 'ArrowUp')    { shift(-1, 0); render(); }
    else if (e.key === 'ArrowDown')  { shift( 1, 0); render(); }
    else if (e.key === 'Home' || e.key === 't' || e.key === 'T') { viewY = curY; viewM = curM; render(); }
  });

  // 加载 2026 国务院硬编码
  if (typeof fetch === 'function') {
    fetch('./holidays-2026.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j) YSCalendar.loadExtraHolidays(j);
      render();
    }).catch(function () { render(); });
  } else {
    render();
  }

  updateHeaderText();
  render();
})();
</script>
</body>
</html>
