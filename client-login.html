<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="业主登录 · 装报价 — 查看您的装修报价">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>业主登录 · 装报价</title>
<style>
  :root { --primary: #6366f1; --primary-2: #4338ca; --bg: #fafaff; --panel: #fff; --border: #e8e8ef; --text: #1a1a2e; --text-dim: #5e5e7a; --text-faint: #9595ad; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #fafaff 0%, #f0f0fa 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(99,102,241,0.08); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }
  .brand-text { font-weight: 700; font-size: 18px; }
  .badge { display: inline-block; background: linear-gradient(135deg, #10b981, #059669); color: #fff; padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: all 0.15s; }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
  .btn { width: 100%; padding: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.35); }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-dim); }
  .alt a { color: var(--primary); font-weight: 500; }
  .err { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }
  .info { background: var(--bg); border-left: 3px solid #10b981; padding: 12px 14px; font-size: 12px; color: var(--text-dim); border-radius: 6px; margin-top: 14px; line-height: 1.6; }
  .info b { color: #10b981; }
</style>
</head>
<body>

<form class="box" onsubmit="event.preventDefault(); doLogin(this);">
  <div class="brand">
    <div class="brand-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <span class="brand-text">装报价</span>
  </div>
  <div class="badge">业主入口</div>
  <h1>查看您的报价</h1>
  <p class="sub">登录后查看您的装修报价和项目进度</p>

  <div class="field">
    <label>手机号</label>
    <input type="tel" name="phone" placeholder="192168 00000" maxlength="11" required>
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" name="password" placeholder="装饰公司给您的密码" required>
  </div>

  <button type="submit" class="btn">登录</button>
  <div class="err" id="err"></div>

  <div class="info">
    💡 您是装修业主?<br>您的装饰公司应已为您注册账号。<br>联系您的装饰公司获取 <b>手机号 + 密码</b>。
  </div>

  <div class="alt">装饰公司人员?<a href="login.html">前台登录 →</a> · <a href="index.html">返回首页</a></div>
</form>

<script>
function doLogin(form) {
  const phone = form.phone.value.trim();
  const pwd = form.password.value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  if (!/^1[3-9][0-9]{9}$/.test(phone)) {
    errEl.textContent = '请输入正确的 11 位手机号';
    return;
  }
  if (!pwd) { errEl.textContent = '请输入密码'; return; }

  const accounts = JSON.parse(localStorage.getItem('yunshu-accounts') || '{}');
  const account = accounts[phone];
  if (!account) {
    errEl.textContent = '账号不存在,请联系您的装饰公司';
    return;
  }
  if (account.pwd !== pwd) {
    errEl.textContent = '密码错误';
    return;
  }
  if (account.role !== 'client') {
    errEl.textContent = '此账号不是业主账号,请用正确的入口登录';
    return;
  }
  if (!account.activated) {
    errEl.textContent = '账号未激活,请联系您的装饰公司';
    return;
  }
  // 设置登录态
  localStorage.setItem('yunshu-user', JSON.stringify({
    phone, role: 'client',
    workspaceName: account.workspaceName || '业主',
    projects: account.projects || [],
    loginAt: Date.now()
  }));
  window.location.href = 'client.html';
}
</script>
</body>
</html>
