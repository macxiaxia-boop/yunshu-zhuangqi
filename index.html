<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="装报价 — 装企现场报价工具">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>装报价 · 现场报价工具</title>
<style>
  :root { --primary: #6366f1; --primary-2: #4338ca; --primary-soft: rgba(99,102,241,0.08); --bg: #fafaff; --bg-2: #f5f5fb; --panel: #fff; --border: #e8e8ef; --text: #1a1a2e; --text-dim: #5e5e7a; --text-faint: #9595ad; --radius: 10px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
  a { color: var(--primary); }
  button, input, textarea, select { font-family: inherit; }
  /* Top bar */
  .topbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .brand-logo { width: 28px; height: 28px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-radius: 7px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(99,102,241,0.25); }
  .brand-name { font-size: 14px; }
  .tool-tabs { display: flex; gap: 2px; background: var(--bg-2); padding: 3px; border-radius: 7px; }
  .tool-tab { padding: 5px 12px; font-size: 12px; cursor: pointer; border-radius: 5px; color: var(--text-dim); font-weight: 500; }
  .tool-tab.active { background: var(--panel); color: var(--primary); }
  .tool-tab:hover:not(.active) { color: var(--text); }
  .header-actions { display: flex; gap: 6px; }
  .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 12px; cursor: pointer; transition: all 0.15s; font-weight: 500; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-primary:hover { background: var(--primary-2); border-color: var(--primary-2); color: #fff; }
  .btn-icon { padding: 4px 8px; background: transparent; border: none; cursor: pointer; font-size: 14px; color: var(--text-dim); }
  .btn-icon:hover { color: var(--primary); }
  .btn-sm { padding: 3px 8px; font-size: 11px; }
  /* Main */
  .main { padding: 0; }
  .tool { display: none; padding: 18px; }
  .tool.active { display: block; }
  /* Quote tool */
  .quote-layout { display: grid; grid-template-columns: 1fr 360px; gap: 12px; max-width: 1400px; margin: 0 auto; }
  .quote-left, .quote-right { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .sec-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  /* Catalog picker */
  .catalog-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
  .catalog-tab { padding: 4px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; cursor: pointer; }
  .catalog-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 220px; overflow-y: auto; }
  .catalog-item { padding: 8px 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; }
  .catalog-item:hover { border-color: var(--primary); background: var(--primary-soft); }
  /* Quote table */
  .qtable { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  .qtable th { background: var(--bg-2); padding: 8px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--text-dim); font-size: 11px; }
  .qtable td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
  .qtable td.num, .qtable th.num { text-align: right; font-family: monospace; }
  .qtable td.inp-cell { padding: 4px; }
  .qtable input.inp { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-2); font-size: 12px; }
  .qtable input.inp:focus { border-color: var(--primary); background: var(--panel); outline: none; }
  .qtable input.inp.num { font-family: monospace; text-align: right; }
  .qtable tfoot td { background: var(--bg-2); font-weight: 700; }
  .qtable tfoot .total { color: var(--primary); font-size: 16px; }
  .qtable .del-btn { background: transparent; color: #f87171; border: none; cursor: pointer; font-size: 13px; padding: 2px 6px; }
  .qtable .del-btn:hover { color: #ef4444; }
  .empty-line { padding: 24px; text-align: center; color: var(--text-faint); font-size: 12px; }
  /* Right side */
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; font-weight: 500; }
  .input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; background: var(--bg-2); }
  .input:focus { border-color: var(--primary); background: var(--panel); }
  textarea.input { min-height: 50px; resize: vertical; }
  .total-card { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 16px; border-radius: 8px; text-align: center; margin-top: 12px; box-shadow: 0 6px 16px rgba(99,102,241,0.25); }
  .total-card .label { font-size: 11px; opacity: 0.85; }
  .total-card .amount { font-size: 32px; font-weight: 800; margin-top: 4px; font-family: monospace; }
  .total-card .note { font-size: 11px; opacity: 0.85; margin-top: 4px; }
  /* Add custom row */
  .add-form { display: grid; grid-template-columns: 2fr 0.6fr 0.5fr 0.6fr auto; gap: 6px; margin-bottom: 10px; }
  .add-form input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; font-size: 12px; background: var(--bg-2); }
  /* Library tool */
  .lib-tool { max-width: 1200px; margin: 0 auto; }
  .lib-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .lib-item { padding: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
  .lib-item .name { font-weight: 600; font-size: 13px; }
  .lib-item .price { font-family: monospace; font-size: 13px; color: var(--primary); }
  /* History */
  .hist-item { padding: 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .hist-item .info { flex: 1; }
  .hist-item .name { font-weight: 600; font-size: 13px; }
  .hist-item .meta { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .hist-item .total { font-family: monospace; font-weight: 700; color: var(--primary); font-size: 14px; margin-right: 12px; }
  /* Toast */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--primary); color: #fff; padding: 8px 18px; border-radius: 6px; font-size: 13px; box-shadow: 0 6px 18px rgba(99,102,241,0.35); opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 1000; font-weight: 500; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Share modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-bg.active { display: flex; }
  .modal { background: var(--panel); border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-radius: 12px 12px 0 0; }
  .modal-head h3 { font-size: 15px; font-weight: 700; }
  .modal-close { background: rgba(255,255,255,0.2); border: none; cursor: pointer; font-size: 18px; color: #fff; width: 28px; height: 28px; border-radius: 50%; }
  .modal-body { padding: 18px; }
  .empty { text-align: center; padding: 30px 20px; color: var(--text-faint); font-size: 13px; }
  @media (max-width: 1100px) { .quote-layout { grid-template-columns: 1fr; } .lib-list { grid-template-columns: 1fr 1fr; } }
  @media print { .topbar, .quote-right, .catalog-tabs, .catalog-grid, .empty-line, .toast { display: none !important; } body { background: white; padding: 0; } .quote-left { box-shadow: none; border: none; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <span class="brand-name">装报价</span>
  </div>
  <div class="tool-tabs">
    <div class="tool-tab active" data-tool="quote" onclick="switchTool('quote')">🧮 报价生成</div>
    <div class="tool-tab" data-tool="library" onclick="switchTool('library')">📦 项目库</div>
    <div class="tool-tab" data-tool="history" onclick="switchTool('history')">📜 历史</div>
  </div>
  <div class="header-actions">
    <button class="btn" onclick="exportAll()">📤 导出数据</button>
    <button class="btn" onclick="resetAll()">🗑 重置</button>
  </div>
</div>

<div class="main">

  <!-- ============ 报价生成 ============ -->
  <div class="tool active" data-tool="quote">
    <div class="quote-layout">

      <div class="quote-left">
        <div class="sec-title">📦 项目库(点选加入报价)</div>
        <div class="catalog-tabs" id="catalogTabs"></div>
        <div class="catalog-grid" id="catalogGrid"></div>

        <div class="sec-title" style="margin-top:14px">📋 当前报价(可编辑)</div>
        <table class="qtable" id="qTable">
          <thead><tr><th style="width:28px">#</th><th>项目</th><th style="width:55px">单位</th><th style="width:60px" class="num">数量</th><th style="width:75px" class="num">单价</th><th style="width:80px" class="num">小计</th><th style="width:30px"></th></tr></thead>
          <tbody id="qBody"></tbody>
          <tfoot><tr><td colspan="5" class="num">合计</td><td colspan="2" class="num total" id="qTotal">¥0.00</td></tr></tfoot>
        </table>

        <div class="add-form" style="margin-top:12px">
          <input id="addName" placeholder="项目名(自定义)">
          <input id="addUnit" placeholder="单位" value="项">
          <input id="addQty" type="number" placeholder="数量" value="1">
          <input id="addPrice" type="number" placeholder="单价" value="0">
          <button class="btn btn-primary" onclick="addCustom()">+ 加</button>
        </div>
      </div>

      <div class="quote-right">
        <div class="sec-title">👤 业主信息</div>
        <div class="field"><label>业主姓名</label><input class="input" id="cName" placeholder="例:张先生"></div>
        <div class="field"><label>业主手机</label><input class="input" id="cPhone" placeholder="例:138 0000 0000" maxlength="11"></div>
        <div class="field"><label>装修地址</label><input class="input" id="cAddress" placeholder="例:朝阳区望京 SOHO 1号楼"></div>
        <div class="field"><label>面积(㎡)</label><input class="input" id="cArea" type="number" placeholder="例:90"></div>
        <div class="field"><label>装修类型</label><select class="input" id="cType"><option>全包</option><option>半包</option><option>清包</option><option>局装</option></select></div>
        <div class="field"><label>备注</label><textarea class="input" id="cNotes" placeholder="业主要求"></textarea></div>

        <div class="total-card">
          <div class="label">本次报价总计</div>
          <div class="amount" id="bigTotal">¥0.00</div>
          <div class="note" id="bigTotalNote">含管理费及税金</div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
          <button class="btn" onclick="window.print()">🖨 打印</button>
          <button class="btn btn-primary" onclick="generateAndShare()">📤 生成+分享</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ============ 项目库管理 ============ -->
  <div class="tool" data-tool="library">
    <div class="lib-tool">
      <div class="sec-title">📦 项目库管理 · 配置产品模板</div>
      <div class="add-form" style="max-width:800px;margin-bottom:14px;grid-template-columns:2fr 0.8fr 0.8fr 0.8fr auto">
        <input id="libName" placeholder="项目名(例:水电改造)">
        <input id="libUnit" placeholder="单位" value="㎡">
        <input id="libPrice" type="number" placeholder="默认单价" value="0">
        <select id="libCat"><option value="基础">基础</option><option value="主材">主材</option><option value="设计">设计</option><option value="其他">其他</option></select>
        <button class="btn btn-primary" onclick="addLibItem()">+ 添加</button>
      </div>
      <div id="libList"></div>
    </div>
  </div>

  <!-- ============ 历史 ============ -->
  <div class="tool" data-tool="history">
    <div class="lib-tool">
      <div class="sec-title">📜 报价历史 · 查看/再分享</div>
      <div id="histList"></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Share Modal -->
<div class="modal-bg" id="shareModal">
  <div class="modal">
    <div class="modal-head">
      <h3>📤 报价已生成</h3>
      <button class="modal-close" onclick="document.getElementById('shareModal').classList.remove('active')">×</button>
    </div>
    <div class="modal-body">
      <div style="background:var(--primary-soft);padding:12px;border-radius:6px;margin-bottom:12px">
        <div style="font-size:11px;color:var(--primary);font-weight:600;margin-bottom:6px">🔗 业主访问链接(公开,无需账号)</div>
        <input class="input" id="shareUrl" readonly onclick="this.select()" style="font-family:monospace;font-size:11px;background:var(--panel)">
        <div style="margin-top:8px;display:flex;gap:6px">
          <button class="btn btn-primary" onclick="navigator.clipboard.writeText(document.getElementById('shareUrl').value).then(()=>showToast('已复制'))" style="flex:1;font-size:11px">📋 复制</button>
          <button class="btn" onclick="window.open(document.getElementById('shareUrl').value, '_blank')" style="flex:1;font-size:11px">👁 预览</button>
        </div>
      </div>
      <div style="font-size:11px;color:var(--text-dim);line-height:1.7;background:var(--bg-2);padding:10px;border-radius:6px">
        💡 微信发给业主即可,业主手机扫码直接打开看(数据编码在 URL 里,跨设备可用)。
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============ 数据模型 ============
const DEFAULT_CATALOG = [
  { name: '设计服务费', unit: '㎡', price: 200, category: '设计' },
  { name: '量房出图', unit: '次', price: 0, category: '设计' },
  { name: '水电改造', unit: '㎡', price: 180, category: '基础' },
  { name: '防水工程', unit: '㎡', price: 80, category: '基础' },
  { name: '墙面处理', unit: '㎡', price: 35, category: '基础' },
  { name: '地面找平', unit: '㎡', price: 25, category: '基础' },
  { name: '拆除工程', unit: '㎡', price: 45, category: '基础' },
  { name: '垃圾清运', unit: '次', price: 800, category: '基础' },
  { name: '吊顶龙骨', unit: '㎡', price: 85, category: '基础' },
  { name: '墙地砖铺贴', unit: '㎡', price: 120, category: '基础' },
  { name: '木作柜子', unit: '延米', price: 1800, category: '基础' },
  { name: '墙面乳胶漆', unit: '㎡', price: 38, category: '基础' },
  { name: '瓷砖', unit: '㎡', price: 180, category: '主材' },
  { name: '地板', unit: '㎡', price: 280, category: '主材' },
  { name: '橱柜', unit: '延米', price: 2200, category: '主材' },
  { name: '卫浴', unit: '套', price: 4500, category: '主材' },
  { name: '灯具', unit: '套', price: 3800, category: '主材' },
  { name: '开关插座', unit: '套', price: 1200, category: '主材' },
  { name: '管理费', unit: '项', price: 0, category: '其他' },
  { name: '税费(3%)', unit: '项', price: 0, category: '其他' },
];

const KEY = {
  catalog: 'yunshu-catalog',
  history: 'yunshu-history',
  currentQuote: 'yunshu-current-quote',
  currentClient: 'yunshu-current-client'
};

// ============ Utils ============
function $(s, p) { return (p || document).querySelector(s); }
function $$(s, p) { return Array.from((p || document).querySelectorAll(s)); }
function loadJSON(key, def) {
  try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? def : v; } catch(e) { return def; }
}
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c])); }
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 100);
}

// ============ Tab 切换 ============
function switchTool(name) {
  $$('.tool-tab').forEach(t => t.classList.toggle('active', t.dataset.tool === name));
  $$('.tool').forEach(s => s.classList.toggle('active', s.dataset.tool === name));
  if (name === 'library') renderLibList();
  if (name === 'history') renderHistList();
}

// ============ 项目库 ============
function getCatalog() {
  let c = loadJSON(KEY.catalog, null);
  if (!c || !Array.isArray(c) || !c.length) { c = DEFAULT_CATALOG; saveJSON(KEY.catalog, c); }
  return c;
}

function renderCatalogPicker() {
  const cat = loadJSON('yunshu-picker-cat', '全部');
  const all = ['全部', ...new Set(getCatalog().map(c => c.category || '其他'))];
  $('#catalogTabs').innerHTML = all.map(c => `<div class="catalog-tab ${c === cat ? 'active' : ''}" onclick="pickCat('${c}')">${c}</div>`).join('');
  const items = cat === '全部' ? getCatalog() : getCatalog().filter(c => c.category === cat);
  $('#catalogGrid').innerHTML = items.map((c, i) => `<div class="catalog-item" onclick="addFromCatalog(${i})"><span>${c.name}</span><b style="color:var(--primary);font-family:monospace;">¥${c.price}/${c.unit}</b></div>`).join('');
}
function pickCat(cat) { saveJSON('yunshu-picker-cat', cat); renderCatalogPicker(); }
function addFromCatalog(i) {
  const cat = loadJSON('yunshu-picker-cat', '全部');
  const items = cat === '全部' ? getCatalog() : getCatalog().filter(c => c.category === cat);
  const c = items[i]; if (!c) return;
  addToQuote({ name: c.name, unit: c.unit, qty: 1, price: c.price });
}

function renderLibList() {
  const list = $('#libList');
  const cat = getCatalog();
  if (!cat.length) { list.innerHTML = '<div class="empty">还没有项目,上方添加</div>'; return; }
  list.innerHTML = '<div class="lib-list">' + cat.map((c, i) => `<div class="lib-item"><div><div class="name">${c.name}</div><div style="font-size:11px;color:var(--text-faint);margin-top:2px">${c.category} · ¥${c.price}/${c.unit}</div></div><div style="display:flex;gap:4px"><button class="btn-icon" onclick="editLib(${i})">✏️</button><button class="btn-icon" onclick="deleteLib(${i})" style="color:#f87171">🗑</button></div></div>`).join('') + '</div>';
}

function addLibItem() {
  const name = $('#libName').value.trim();
  const unit = $('#libUnit').value.trim() || '项';
  const price = parseFloat($('#libPrice').value) || 0;
  const category = $('#libCat').value;
  if (!name) { showToast('请填项目名'); return; }
  const cat = getCatalog();
  cat.push({ name, unit, price, category });
  saveJSON(KEY.catalog, cat);
  $('#libName').value = ''; $('#libUnit').value = '㎡'; $('#libPrice').value = 0;
  renderLibList(); renderCatalogPicker();
  showToast('✓ 已添加:' + name);
}

function deleteLib(i) { if (!confirm('删除这个项目模板?')) return; const cat = getCatalog(); cat.splice(i, 1); saveJSON(KEY.catalog, cat); renderLibList(); renderCatalogPicker(); showToast('已删除'); }

function editLib(i) {
  const cat = getCatalog();
  const c = cat[i];
  const name = prompt('项目名', c.name); if (name == null) return;
  const price = prompt('单价', c.price); if (price == null) return;
  c.name = name; c.price = parseFloat(price) || 0;
  saveJSON(KEY.catalog, cat);
  renderLibList(); renderCatalogPicker();
  showToast('✓ 已更新');
}

// ============ 报价 ============
let currentQuote = loadJSON(KEY.currentQuote, []);
let currentCat = loadJSON(KEY.currentClient, { name: '', phone: '', address: '', area: '', type: '全包', notes: '' });

function addToQuote(item) { currentQuote.push(item); saveJSON(KEY.currentQuote, currentQuote); renderQuote(); }

function removeQuoteItem(i) { currentQuote.splice(i, 1); saveJSON(KEY.currentQuote, currentQuote); renderQuote(); }

function updateQuoteItem(i, field, value) {
  if (!currentQuote[i]) return;
  if (field === 'qty' || field === 'price') value = parseFloat(value) || 0;
  currentQuote[i][field] = value;
  saveJSON(KEY.currentQuote, currentQuote);
  renderQuote();
}

function renderQuote() {
  const body = $('#qBody');
  if (!currentQuote.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty-line">还没点模板,上方项目库选</td></tr>';
  } else {
    body.innerHTML = currentQuote.map((it, i) => `<tr><td>${i + 1}</td><td class="inp-cell"><input class="inp" value="${escapeHtml(it.name)}" oninput="updateQuoteItem(${i}, 'name', this.value)"></td><td class="inp-cell"><input class="inp" value="${escapeHtml(it.unit)}" oninput="updateQuoteItem(${i}, 'unit', this.value)"></td><td class="inp-cell"><input class="inp num" type="number" value="${it.qty}" oninput="updateQuoteItem(${i}, 'qty', this.value)"></td><td class="inp-cell"><input class="inp num" type="number" value="${it.price}" oninput="updateQuoteItem(${i}, 'price', this.value)"></td><td class="num">¥${((it.qty || 0) * (it.price || 0)).toFixed(2)}</td><td><button class="del-btn" onclick="removeQuoteItem(${i})">×</button></td></tr>`).join('');
  }
  updateTotal();
}

function updateTotal() {
  const total = currentQuote.reduce((s, it) => s + (it.qty || 0) * (it.price || 0), 0);
  $('#qTotal').textContent = '¥' + total.toFixed(2);
  $('#bigTotal').textContent = '¥' + total.toLocaleString('zh-CN');
  const area = parseFloat($('#cArea').value) || 0;
  $('#bigTotalNote').textContent = area > 0 ? `共 ${area} ㎡ · ¥${(total / area).toFixed(0)}/㎡` : '含管理费及税金';
}

function addCustom() {
  const name = $('#addName').value.trim();
  if (!name) { showToast('填项目名'); return; }
  addToQuote({ name, unit: $('#addUnit').value.trim() || '项', qty: parseFloat($('#addQty').value) || 1, price: parseFloat($('#addPrice').value) || 0 });
  $('#addName').value = ''; $('#addQty').value = 1; $('#addPrice').value = 0;
  showToast('✓ 已加:' + name);
}

function saveCurrentClient() {
  currentCat.name = $('#cName').value.trim();
  currentCat.phone = $('#cPhone').value.trim();
  currentCat.address = $('#cAddress').value.trim();
  currentCat.area = $('#cArea').value;
  currentCat.type = $('#cType').value;
  currentCat.notes = $('#cNotes').value.trim();
  saveJSON(KEY.currentClient, currentCat);
}

['cName', 'cPhone', 'cAddress', 'cArea', 'cType', 'cNotes'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', saveCurrentClient);
});

// ============ 生成 + 分享 ============
function generateAndShare() {
  if (!currentQuote.length) { alert('请先在项目库选模板,加入报价'); return; }
  saveCurrentClient();
  if (!currentCat.name) { alert('请填业主姓名(右侧)'); $('#cName').focus(); return; }
  const total = currentQuote.reduce((s, it) => s + (it.qty || 0) * (it.price || 0), 0);
  const area = parseFloat(currentCat.area) || 0;
  const id = 'Q' + Date.now();
  const quote = { id, createdAt: Date.now(), workspaceName: '装报价', client: { ...currentCat }, items: JSON.parse(JSON.stringify(currentQuote)), total, area };
  const hist = loadJSON(KEY.history, []);
  hist.unshift(quote);
  saveJSON(KEY.history, hist);
  const json = JSON.stringify(quote);
  const encoded = btoa(encodeURIComponent(json));
  const baseUrl = location.href.replace(/\/[^\/]*$/, '/');
  const shareUrl = baseUrl + 'view.html?d=' + encoded;
  navigator.clipboard.writeText(shareUrl).catch(() => {});
  document.getElementById('shareUrl').value = shareUrl;
  document.getElementById('shareModal').classList.add('active');
  showToast('✓ 已生成链接,点击复制');
}

// ============ 历史 ============
function renderHistList() {
  const list = $('#histList');
  const hist = loadJSON(KEY.history, []);
  if (!hist.length) { list.innerHTML = '<div class="empty">还没有报价历史</div>'; return; }
  list.innerHTML = hist.map((q, i) => `<div class="hist-item"><div class="info"><div class="name">${q.client.name} · ${q.client.type}${q.client.area ? ' · ' + q.client.area + '㎡' : ''}</div><div class="meta">${new Date(q.createdAt).toLocaleString('zh-CN')} · ${q.items.length} 项</div></div><div class="total">¥${q.total.toLocaleString('zh-CN')}</div><button class="btn btn-sm" onclick="reshareHist(${i})">📤 再分享</button><button class="btn-icon" onclick="deleteHist(${i})" style="color:#f87171">🗑</button></div>`).join('');
}

function reshareHist(i) {
  const hist = loadJSON(KEY.history, []);
  const q = hist[i]; if (!q) return;
  const json = JSON.stringify(q);
  const encoded = btoa(encodeURIComponent(json));
  const baseUrl = location.href.replace(/\/[^\/]*$/, '/');
  const url = baseUrl + 'view.html?d=' + encoded;
  navigator.clipboard.writeText(url).catch(() => {});
  alert('分享链接:\n\n' + url + '\n\n(已复制)');
}

function deleteHist(i) { if (!confirm('删除这条历史?已分享的链接也会失效。')) return; const hist = loadJSON(KEY.history, []); hist.splice(i, 1); saveJSON(KEY.history, hist); renderHistList(); }

// ============ 导出/重置 ============
function exportAll() {
  const data = {
    catalog: getCatalog(), history: loadJSON(KEY.history, [])
  };
  downloadFile(JSON.stringify(data, null, 2), `装报价备份_${new Date().toISOString().slice(0,10)}.json`, 'application/json');
  showToast('✓ 已下载备份');
}

function resetAll() {
  if (!confirm('⚠️ 确认清空所有数据?\n\n这不能撤销!')) return;
  Object.values(KEY).forEach(k => localStorage.removeItem(k));
  location.reload();
}

// ============ Init ============
window.addEventListener('DOMContentLoaded', () => {
  renderCatalogPicker();
  renderQuote();
  const c = loadJSON(KEY.currentClient, {});
  ['cName', 'cPhone', 'cAddress', 'cArea', 'cType', 'cNotes'].forEach(id => {
    const key = id.replace('c', '').toLowerCase();
    const v = c[key] || '';
    const el = $('#' + id); if (el) el.value = v;
  });
  $('#cArea').addEventListener('input', updateTotal);
  updateTotal();
});
</script>

</body>
