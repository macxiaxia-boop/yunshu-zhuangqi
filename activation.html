<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B50029">
<title>已开通 · 装报价</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #fafaff 0%, #f5f5fb 100%); color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; }
  .box { width: 100%; max-width: 460px; background: #fff; border: 1px solid #e8e8ef; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(181,0,41,0.08); text-align: center; }
  .ok-circle { width: 72px; height: 72px; background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(22,163,74,0.25); }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: #5e5e7a; font-size: 14px; margin-bottom: 24px; }
  .info { background: #fafaff; border-radius: 12px; padding: 16px; margin-bottom: 24px; font-size: 13px; color: #5e5e7a; line-height: 1.7; text-align: left; }
  .info b { color: #16a34a; }
  button { width: 100%; padding: 14px; background: linear-gradient(135deg, #B50029, #8B0029); color: #fff; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 600; box-shadow: 0 4px 12px rgba(181,0,41,0.25); }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(181,0,41,0.35); }
</style>
</head>
<body>

<div class="box">
  <div class="ok-circle">✓</div>
  <h1>已开通</h1>
  <p class="sub">您的账号已激活,可以开始使用</p>

  <div class="info">
    💡 您的 <b>装报价</b> 账号已开通全部功能。<br>
    所有项目数据保存在本地浏览器,可随时导出 ZIP 备份。
  </div>

  <button onclick="goApp()">进入工作台 →</button>
</div>

<script>
function goApp() {
  const user = JSON.parse(localStorage.getItem('yunshu-user') || '{}');
  user.activated = true;
  user.activatedAt = Date.now();
  localStorage.setItem('yunshu-user', JSON.stringify(user));
  window.location.href = 'app.html';
}
setTimeout(goApp, 1500);
</script>
</body>
</html>
