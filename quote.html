<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="装报价生成器 — 商家销售工具,现场给业主出报价">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>报价生成器 · 装报价</title>
<style>
  :root { --primary: #6366f1; --primary-2: #4338ca; --primary-soft: rgba(99,102,241,0.08); --bg: #fafaff; --bg-2: #f5f5fb; --panel: #fff; --border: #e8e8ef; --text: #1a1a2e; --text-dim: #5e5e7a; --text-faint: #9595ad; --shadow: 0 4px 12px rgba(0,0,0,0.05); --radius: 12px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; min-height: 100vh; }
  a { color: var(--primary); text-decoration: none; }
  /* Header */
  .header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(99,102,241,0.25); }
  .brand-text { font-weight: 700; }
  .actions { display: flex; gap: 8px; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; }
  /* Layout */
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 380px; gap: 16px; }
  /* Left: 报价区 */
  .quote-area { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  /* 项目库 tabs */
  .catalog-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .catalog-tab { padding: 6px 12px; background: var(--bg-2); border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); }
  .catalog-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  /* Catalog grid */
  .catalog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  .catalog-item { padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.1s; display: flex; justify-content: space-between; align-items: center; }
  .catalog-item:hover { border-color: var(--primary); background: var(--primary-soft); }
  .catalog-item .name { font-size: 13px; font-weight: 500; }
  .catalog-item .price { font-family: monospace; font-size: 12px; color: var(--text-dim); }
  /* 报价单 */
  .quote-list { margin-top: 24px; }
  .quote-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .quote-table th { background: var(--bg-2); padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--text-dim); font-size: 12px; }
  .quote-table td { padding: 10px; border-bottom: 1px solid var(--border); }
  .quote-table .num { text-align: right; font-family: monospace; }
  .quote-table input.inp { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-2); font-family: monospace; font-size: 12px; color: var(--text); }
  .quote-table input.inp:focus { border-color: var(--primary); outline: none; }
  .quote-table .del-btn { background: transparent; color: #f87171; border: none; cursor: pointer; font-size: 14px; padding: 4px 8px; }
  .quote-table tfoot td { background: var(--bg-2); font-weight: 700; }
  .quote-table tfoot .total { color: var(--primary); font-size: 16px; }
  .empty-list { padding: 30px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
  /* Right: 业主信息 */
  .client-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; height: fit-content; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; background: var(--bg-2); color: var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); background: var(--panel); }
  .field textarea { min-height: 60px; resize: vertical; }
  .client-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .client-actions .btn { width: 100%; padding: 10px; font-size: 13px; font-weight: 600; }
  .total-display { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 16px; border-radius: 8px; text-align: center; margin: 16px 0; }
  .total-display .label { font-size: 12px; opacity: 0.85; }
  .total-display .amount { font-size: 32px; font-weight: 800; margin-top: 4px; font-family: monospace; }
  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(99,102,241,0.35); opacity: 0; transition: all 0.2s; pointer-events: none; z-index: 1000; font-weight: 500; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 1100px) { .container { grid-template-columns: 1fr; } }
  @media print {
    .header, .client-panel, .catalog-tabs, .catalog-grid, .empty-list, .toast { display: none !important; }
    body { background: white; padding: 0; }
    .container { padding: 0; display: block; }
    .quote-area { box-shadow: none; border: none; padding: 0; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="app.html" class="brand">
    <div class="brand-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <span class="brand-text">装报价 · <span id="brandSub">报价生成器</span></span>
  </a>
  <div class="actions">
    <a href="admin.html" class="btn">⚙️ 项目库管理</a>
    <button class="btn" onclick="clearQuote()">🧹 清空</button>
    <button class="btn" onclick="doLogout()">退出</button>
    <button class="btn btn-primary" onclick="generateQuote()">📤 生成报价 → 导出</button>
  </div>
</header>

<div class="container">

  <!-- 左:报价生成器主体 -->
  <div class="quote-area">

    <div class="section-title">📦 项目库模板 · 点击添加到报价</div>

    <div class="catalog-tabs" id="catalogTabs">
      <div class="catalog-tab active" data-cat="all" onclick="filterCatalog('all')">全部</div>
      <div class="catalog-tab" data-cat="基础" onclick="filterCatalog('基础')">基础工程</div>
      <div class="catalog-tab" data-cat="主材" onclick="filterCatalog('主材')">主材代购</div>
      <div class="catalog-tab" data-cat="设计" onclick="filterCatalog('设计')">设计服务</div>
      <div class="catalog-tab" data-cat="其他" onclick="filterCatalog('其他')">其他</div>
    </div>

    <div class="catalog-grid" id="catalogGrid"></div>

    <div class="quote-list">
      <div class="section-title" style="margin-top:8px">
        <span>📋 当前报价</span>
        <span style="margin-left:auto;font-size:12px;color:var(--text-faint);font-weight:400">可改单价/数量</span>
      </div>
      <div id="quoteTableWrap">
        <table class="quote-table" id="quoteTable">
          <thead><tr>
            <th style="width:36px">#</th>
            <th>项目</th>
            <th style="width:60px">单位</th>
            <th style="width:80px">数量</th>
            <th style="width:90px">单价</th>
            <th class="num" style="width:90px">小计</th>
            <th style="width:36px"></th>
          </tr></thead>
          <tbody id="quoteBody"></tbody>
          <tfoot><tr><td colspan="5" class="num">合计</td><td colspan="2" class="num total" id="quoteTotal">¥0.00</td></tr></tfoot>
        </table>
      </div>
    </div>

  </div>

  <!-- 右:业主信息 + 总价 -->
  <div class="client-panel">

    <div class="section-title">👤 业主信息</div>

    <div class="field">
      <label>业主姓名</label>
      <input id="cName" placeholder="例:张先生">
    </div>
    <div class="field">
      <label>业主手机</label>
      <input id="cPhone" placeholder="例:138 0000 0000" maxlength="11">
    </div>
    <div class="field">
      <label>装修地址</label>
      <input id="cAddress" placeholder="例:朝阳区望京 SOHO 1号楼">
    </div>
    <div class="field">
      <label>面积(㎡)</label>
      <input id="cArea" type="number" placeholder="例:90" min="0">
    </div>
    <div class="field">
      <label>装修类型</label>
      <select id="cType">
        <option value="全包">全包</option>
        <option value="半包">半包</option>
        <option value="清包">清包</option>
        <option value="局装">局装</option>
      </select>
    </div>
    <div class="field">
      <label>备注</label>
      <textarea id="cNotes" placeholder="例:业主希望简约风格,主材预算 8 万"></textarea>
    </div>

    <div class="total-display">
      <div class="label">本次报价总计</div>
      <div class="amount" id="bigTotal">¥0.00</div>
      <div style="font-size:11px;opacity:0.85;margin-top:4px" id="bigTotalNote">含管理费及税金</div>
    </div>

    <div class="client-actions">
      <button class="btn" onclick="window.print()">🖨 打印</button>
      <button class="btn btn-primary" onclick="generateQuote()">📤 生成 + 下载</button>
    </div>

    <div style="margin-top:14px;padding:10px;background:var(--bg-2);border-radius:6px;font-size:11px;color:var(--text-dim);line-height:1.6;">
      💡 <strong>提示</strong>:在右栏填业主信息 → 左侧选模板 → 点"生成 + 下载"得报价单(HTML + JSON 文件)
    </div>

  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ Default catalog (项目库) ============
// 用户可在 admin.html 增删改
const DEFAULT_CATALOG = [
  // 设计服务
  { name: '设计服务费',  unit: '㎡',    price: 200,  category: '设计' },
  { name: '量房出图',    unit: '次',    price: 0,    category: '设计' },
  // 基础工程
  { name: '水电改造',    unit: '㎡',    price: 180,  category: '基础' },
  { name: '防水工程',    unit: '㎡',    price: 80,   category: '基础' },
  { name: '墙面处理',    unit: '㎡',    price: 35,   category: '基础' },
  { name: '地面找平',    unit: '㎡',    price: 25,   category: '基础' },
  { name: '拆除工程',    unit: '㎡',    price: 45,   category: '基础' },
  { name: '垃圾清运',    unit: '次',    price: 800,  category: '基础' },
  { name: '吊顶龙骨',    unit: '㎡',    price: 85,   category: '基础' },
  { name: '墙地砖铺贴',  unit: '㎡',    price: 120,  category: '基础' },
  { name: '木作柜子',    unit: '延米',  price: 1800, category: '基础' },
  { name: '墙面乳胶漆',  unit: '㎡',    price: 38,   category: '基础' },
  // 主材
  { name: '瓷砖',        unit: '㎡',    price: 180,  category: '主材' },
  { name: '地板',        unit: '㎡',    price: 280,  category: '主材' },
  { name: '橱柜',        unit: '延米',  price: 2200, category: '主材' },
  { name: '卫浴',        unit: '套',    price: 4500, category: '主材' },
  { name: '灯具',        unit: '套',    price: 3800, category: '主材' },
  { name: '开关插座',    unit: '套',    price: 1200, category: '主材' },
  // 其他
  { name: '管理费',      unit: '项',    price: 0,    category: '其他' },
  { name: '税费(3%)',   unit: '项',    price: 0,    category: '其他' },
];

function getCatalogFromAdmin() {
  try {
    const stored = JSON.parse(localStorage.getItem('yunshu-catalog') || 'null');
    if (Array.isArray(stored) && stored.length) return stored;
  } catch (e) {}
  return DEFAULT_CATALOG;
}

function saveCatalog(catalog) {
  try { localStorage.setItem('yunshu-catalog', JSON.stringify(catalog)); } catch (e) {}
}

let catalog = getCatalogFromAdmin();
let currentQuote = []; // 当前报价 [{name, unit, qty, price}]
let currentCat = 'all';

function renderCatalog() {
  const grid = document.getElementById('catalogGrid');
  const filtered = currentCat === 'all' ? catalog : catalog.filter(c => c.category === currentCat);
  if (!filtered.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-faint);font-size:12px;">项目库为空,去 admin.html 添加</div>';
    return;
  }
  grid.innerHTML = filtered.map((c, i) => `
    <div class="catalog-item" onclick="addToQuote('${c.name.replace(/'/g, "\\'")}', '${c.unit}', ${c.price})">
      <div class="name">${c.name}</div>
      <div class="price">¥${c.price}/${c.unit}</div>
    </div>`).join('');
}

function filterCatalog(cat) {
  currentCat = cat;
  document.querySelectorAll('.catalog-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
  renderCatalog();
}

function addToQuote(name, unit, price) {
  // 默认数量:如果是/㎡/延米/项 — 默认 1,其他 — 默认 1
  currentQuote.push({ name, unit, qty: 1, price });
  renderQuote();
  showToast('✓ 已添加:' + name);
}

function removeFromQuote(i) {
  currentQuote.splice(i, 1);
  renderQuote();
}

function renderQuote() {
  const body = document.getElementById('quoteBody');
  if (!currentQuote.length) {
    body.innerHTML = '<tr><td colspan="7" class="empty-list">还没选项目,点击上方"项目库模板"开始</td></tr>';
  } else {
    body.innerHTML = currentQuote.map((it, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><input class="inp" data-idx="${i}" data-fld="name" value="${(it.name || '').replace(/"/g, '&quot;')}" oninput="updQuote()"></td>
        <td><input class="inp" data-idx="${i}" data-fld="unit" value="${(it.unit || '').replace(/"/g, '&quot;')}" oninput="updQuote()"></td>
        <td><input class="inp num" type="number" data-idx="${i}" data-fld="qty" value="${it.qty}" oninput="updQuote()"></td>
        <td><input class="inp num" type="number" data-idx="${i}" data-fld="price" value="${it.price}" oninput="updQuote()"></td>
        <td class="num">¥${(it.qty * it.price).toFixed(2)}</td>
        <td><button class="del-btn" onclick="removeFromQuote(${i})">×</button></td>
      </tr>`).join('');
  }
  updateTotal();
}

function updQuote() {
  document.querySelectorAll('#quoteBody input.inp').forEach(el => {
    const i = parseInt(el.dataset.idx);
    const f = el.dataset.fld;
    let v = el.value;
    if (f === 'qty' || f === 'price') v = parseFloat(v) || 0;
    if (currentQuote[i]) currentQuote[i][f] = v;
  });
  updateTotal();
}

function updateTotal() {
  const total = currentQuote.reduce((s, it) => s + (it.qty || 0) * (it.price || 0), 0);
  document.getElementById('quoteTotal').textContent = '¥' + total.toFixed(2);
  document.getElementById('bigTotal').textContent = '¥' + total.toLocaleString('zh-CN');
  const area = parseFloat(document.getElementById('cArea').value) || 0;
  if (area > 0) {
    const perSqm = total / area;
    document.getElementById('bigTotalNote').textContent = `共 ${area} ㎡ · ¥${perSqm.toFixed(0)}/㎡`;
  } else {
    document.getElementById('bigTotalNote').textContent = '含管理费及税金';
  }
}

function clearQuote() {
  if (!currentQuote.length && !document.getElementById('cName').value) { showToast('已清空'); return; }
  if (!confirm('清空当前报价?')) return;
  currentQuote = [];
  document.getElementById('cName').value = '';
  document.getElementById('cPhone').value = '';
  document.getElementById('cAddress').value = '';
  document.getElementById('cArea').value = '';
  document.getElementById('cNotes').value = '';
  renderQuote();
  showToast('已清空');
}

function generateQuote() {
  if (!currentQuote.length) { alert('请先选择项目库模板'); return; }
  if (!document.getElementById('cName').value.trim()) { alert('请填写业主姓名'); document.getElementById('cName').focus(); return; }

  const total = currentQuote.reduce((s, it) => s + (it.qty || 0) * (it.price || 0), 0);
  const area = parseFloat(document.getElementById('cArea').value) || 0;

  const quote = {
    id: 'Q' + Date.now(),
    createdAt: Date.now(),
    ownerName: document.getElementById('cName').value.trim(),
    clientPhone: document.getElementById('cPhone').value.trim(),
    address: document.getElementById('cAddress').value.trim(),
    area: area,
    type: document.getElementById('cType').value,
    notes: document.getElementById('cNotes').value.trim(),
    items: JSON.parse(JSON.stringify(currentQuote)),
    total,
    ownerName_brand: '装报价'
  };

  // 生成 HTML 文件下载
  const itemsHtml = quote.items.map((it, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${it.name}</td>
      <td>${it.unit}</td>
      <td style="text-align:right">${it.qty}</td>
      <td style="text-align:right">¥${(it.price || 0).toFixed(2)}</td>
      <td style="text-align:right;font-weight:700;color:#6366f1;">¥${((it.qty || 0) * (it.price || 0)).toFixed(2)}</td>
    </tr>`).join('');
  const html = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${quote.ownerName} 装修报价</title>
<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:30px auto;padding:0 20px;color:#1a1a2e;line-height:1.7;}
h1{font-size:24px;border-bottom:3px solid #6366f1;padding-bottom:10px;}
.meta{color:#5e5e7a;font-size:13px;margin-bottom:14px;}
.meta b{color:#1a1a2e;}
.total{background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;padding:20px;border-radius:10px;text-align:center;margin:20px 0;}
.total .n{font-size:36px;font-weight:800;margin-top:6px;font-family:monospace;}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px;}
th{background:#f0f3ff;padding:12px;text-align:left;border-bottom:1px solid #ddd;font-size:12px;color:#5e5e7a;}
td{padding:12px;border-bottom:1px solid #eee;}
.amt{text-align:right;font-family:monospace;}
.notes{background:#fffbe6;border:1px solid #fbbf24;border-radius:8px;padding:14px;margin:14px 0;color:#78350f;}
.footer{text-align:center;color:#9595ad;font-size:11px;margin-top:30px;padding-top:14px;border-top:1px solid #eee;}
</style></head><body>
<h1>${quote.ownerName} 装修报价单</h1>
<div class="meta">
<b>${quote.ownerName}</b>${quote.clientPhone ? ' · ' + quote.clientPhone : ''}${quote.address ? ' · ' + quote.address : ''}<br>
装修类型:${quote.type} · ${quote.area ? '面积 ' + quote.area + ' ㎡' : '面积未填'} · 报价 ID:${quote.id}<br>
报价日期:${new Date(quote.createdAt).toLocaleString('zh-CN')}
</div>
<div class="total">本次报价总计<div class="n">¥${total.toLocaleString('zh-CN')}</div>${area > 0 ? '<div style="font-size:12px;opacity:0.85;margin-top:4px">共 ' + area + ' ㎡ · ¥' + (total/area).toFixed(0) + '/㎡</div>' : ''}</div>
<table><thead><tr><th>序号</th><th>项目</th><th>单位</th><th class="amt">数量</th><th class="amt">单价</th><th class="amt">小计</th></tr></thead>
<tbody>${itemsHtml}</tbody>
<tfoot><tr style="background:#f0f3ff;font-weight:700;"><td colspan="5" class="amt">总计</td><td class="amt" style="color:#6366f1;font-size:16px;">¥${total.toLocaleString('zh-CN')}</td></tr></tfoot></table>
${quote.notes ? `<div class="notes">📝 <b>备注:</b><br>${quote.notes}</div>` : ''}
<div style="margin-top:20px;padding:14px;background:#f0f3ff;border-radius:8px;font-size:13px;line-height:1.8;">

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 100);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
