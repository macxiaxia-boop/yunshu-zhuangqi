<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B50029">
<title>免费注册 · 装报价</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #fafaff 0%, #f5f5fb 100%); color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; margin: 0; }
  .box { width: 100%; max-width: 440px; background: #fff; border: 1px solid #e8e8ef; border-radius: 20px; padding: 36px; box-shadow: 0 20px 60px rgba(181,0,41,0.08); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-logo { width: 40px; height: 40px; background: linear-gradient(135deg, #B50029, #8B0029); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(181,0,41,0.25); }
  .brand-text { font-weight: 700; font-size: 18px; }
  .badge { display: inline-block; background: rgba(181,0,41,0.08); color: #B50029; padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: #5e5e7a; font-size: 14px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #5e5e7a; margin-bottom: 6px; font-weight: 500; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid #e8e8ef; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; }
  .field input:focus { border-color: #B50029; box-shadow: 0 0 0 3px rgba(181,0,41,0.1); }
  .btn { width: 100%; padding: 12px; border: none; background: linear-gradient(135deg, #B50029, #8B0029); color: #fff; border-radius: 10px; font-size: 15px; font-weight: 600; box-shadow: 0 4px 12px rgba(181,0,41,0.25); margin-top: 8px; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(181,0,41,0.35); }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: #5e5e7a; }
  .alt a { color: #B50029; font-weight: 500; }
  .err { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }
</style>
</head>
<body>

<form class="box" onsubmit="event.preventDefault(); doRegister(this);">
  <div class="brand">
    <div class="brand-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <span class="brand-text">装报价</span>
  </div>
  <div class="badge">¥198 · 终身授权</div>
  <h1>创建账号</h1>
  <p class="sub">注册后扫码支付获取激活码</p>

  <div class="field">
    <label>手机号</label>
    <input type="tel" name="phone" placeholder="138 0000 0000" maxlength="11" required>
  </div>
  <div class="field">
    <label>设置密码(至少 4 位)</label>
    <input type="password" name="password" placeholder="••••••••" required minlength="4">
  </div>
  <div class="field">
    <label>工作室 / 公司名称</label>
    <input type="text" name="company" placeholder="云上工作室" required>
  </div>

  <button type="submit" class="btn">🚀 创建账号</button>
  <div class="err" id="err"></div>

  <div class="alt">已有账号?<a href="login.html">立即登录 →</a></div>
</form>

<script>
// R2119-S seed 默认账号 (18859250439/nuomi1224 已激活)
(function seedAdminAccount(){
  try {
    var PHONE='18859250439', PWD='nuomi1224';
    var a=JSON.parse(localStorage.getItem('yunshu-accounts')||'{}');
    if(!a[PHONE]){a[PHONE]={pwd:PWD,workspaceName:'云数工作室',activated:true,activatedAt:Date.now(),at:Date.now()};}
    else if(!a[PHONE].activated){a[PHONE].activated=true;a[PHONE].activatedAt=Date.now();if(!a[PHONE].workspaceName){a[PHONE].workspaceName='云数工作室';}}
    localStorage.setItem('yunshu-accounts',JSON.stringify(a));
    // 同时设当前 user session (直接可登录)
    localStorage.setItem('yunshu-user',JSON.stringify({phone:PHONE,plan:'paid',activated:true,activatedAt:Date.now(),workspaceName:'云数工作室',loginAt:Date.now()}));
  } catch(e){}
})();
function doRegister(form) {
  const phone = form.phone.value.trim();
  const pwd = form.password.value;
  const company = form.company.value.trim();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  if (!/^1[3-9][0-9]{9}$/.test(phone)) { errEl.textContent = '请输入正确的 11 位手机号'; return; }
  if (pwd.length < 4) { errEl.textContent = '密码至少 4 位'; return; }
  if (!company) { errEl.textContent = '请填写工作室名称'; return; }
  const accounts = JSON.parse(localStorage.getItem('yunshu-accounts') || '{}');
  if (accounts[phone]) { errEl.textContent = '该手机号已注册'; setTimeout(() => window.location.href = 'login.html', 1000); return; }
  accounts[phone] = { pwd, workspaceName: company, at: Date.now(), activated: false };
  localStorage.setItem('yunshu-accounts', JSON.stringify(accounts));
  localStorage.setItem('yunshu-user', JSON.stringify({ phone, plan: 'pending', activated: false, workspaceName: company, loginAt: Date.now() }));
  window.location.href = 'pending.html';
}
</script>
</body>
</html>
