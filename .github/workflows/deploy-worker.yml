# GitHub Actions: 自动部署 yunshu-zhuangqi share-link Worker
# Trigger: master 分支有 _modules/10-share-link/worker.js 改动 OR 手动触发
# 必需 secrets (Repository Settings > Secrets > Actions):
#   CLOUDFLARE_API_TOKEN  ← https://dash.cloudflare.com/profile/api-tokens (Edit Cloudflare Workers 权限)
#   CLOUDFLARE_ACCOUNT_ID ← Account home > 右下角

name: 🅱️ Deploy Worker

on:
  push:
    branches: [master]
    paths:
      - '_modules/worker.js'
      - '_modules/wrangler.toml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy share-link Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: '_modules'
          command: 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployment
        if: success()
        run: |
          echo "✅ Worker deployed!"
          echo "URL: https://yunshu-zhuangqi-share.${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ACCT' }}.workers.dev"
          # Get the real URL
          wrangler deployments list 2>&1 || true

      - name: Test API health
        if: success()
        run: |
          sleep 5
          curl -sf "https://yunshu-zhuangqi-share.${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'ACCT' }}.workers.dev/" || echo "⚠️ not yet accessible"

  promote-share-url:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    name: Push Worker URL to repo
    steps:
      - name: Write Worker URL to share-api-mock
        run: |
          URL=$(wrangler deployments list 2>&1 | grep -oE 'https://yunshu-zhuangqi-share\.[a-z0-9]+\.workers\.dev' | head -1)
          echo "Worker URL: $URL"
          if [ -n "$URL" ]; then
            # Update share-api-mock.js with real Worker URL for next deploy
            sed -i "s|// const WORKER_URL = '.*'|const WORKER_URL = '$URL';|" _modules/10-share-link/share-api-mock.js || true
            git config user.email 'github-actions@users.noreply.github.com'
            git config user.name 'GitHub Actions'
            git add _modules/10-share-link/share-api-mock.js
            git commit -m "📌 Update Worker URL: $URL" || echo "no change"
            git push
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
