name: Deploy 装报价 to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'favicon.svg'
      - 'favicon-192.png'
      - 'favicon-512.png'
      - 'assets/**'
      - 'README.md'
      - 'DEV.md'
      - 'DEPLOY.md'
      - '.github/workflows/deploy.yml'
      - 'share.html'
      - 'admin.html'
      - 'app.html'
      - 'login.html'
      - 'register.html'
      - 'pending.html'
      - 'activation.html'
      - 'pricing.html'
      - 'about.html'
      - 'terms.html'
      - 'privacy.html'
  workflow_dispatch:  # 允许手动触发

# GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 防止并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署成功通知
        if: success()
        run: |
          echo "✅ 装报价部署成功!"
          echo "🌐 访问地址: ${{ steps.deployment.outputs.page_url }}"
          echo "📅 部署时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
