name: 🧪 R31202 Module Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['_modules/**']
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: AGNES reachable
        run: |
          curl -sf "https://apihub.agnes-ai.com/v1/models" \
            -H "Authorization: Bearer $AGNES_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('AGNES models:', len(d['data']))"
        env: { AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }} }
      - name: DeepSeek reachable (视觉模型)
        run: |
          curl -sf "https://api.deepseek.com/v1/models" \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('DeepSeek models:', [m['id'] for m in d['data']])"
        env: { DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} }
      - name: Generate AGNES demo image
        run: |
          mkdir -p _modules/12-ai-floorplan/demo-floorplans
          curl -sf "https://apihub.agnes-ai.com/v1/images/generations" \
            -H "Authorization: Bearer $AGNES_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"agnes-image-2.5-flash","prompt":"2D top-down architectural floor plan 47sqm, technical drawing, black lines","size":"512x512","n":1}' \
            | python3 -c "import json,sys,urllib.request; d=json.load(sys.stdin); url=d['data'][0]['url']; print('downloading',url[:90]); urllib.request.urlretrieve(url, '_modules/12-ai-floorplan/demo-floorplans/ci-47sqm.png'); print('saved')"
          ls -la _modules/12-ai-floorplan/demo-floorplans/
        env: { AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }} }
