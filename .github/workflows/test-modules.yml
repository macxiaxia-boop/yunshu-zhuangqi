name: 🧪 R31202 Module Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['_modules/**']
jobs:
  quick-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: AGNES API test (real)
        run: |
          curl -sf "https://api.deepseek.com/v1/models" -H "Authorization: Bearer $DEEPSEEK_API_KEY" | python3 -m json.tool 2>&1 | head -5
          echo "DeepSeek reachable: $?"
          curl -sf "https://apihub.agnes-ai.com/v1/models" -H "Authorization: Bearer $AGNES_API_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('AGNES models:', len(d['data']))"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      - name: Generate AGNES demo image (CI generation)
        run: |
          mkdir -p _modules/12-ai-floorplan/demo-floorplans
          curl -sf "https://apihub.agnes-ai.com/v1/images/generations" \
            -H "Authorization: Bearer $AGNES_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"agnes-image-2.5-flash","prompt":"2D top-down architectural floor plan 47sqm, black lines on white, technical drawing","size":"512x512","n":1}' \
            | python3 -c "import json,sys,urllib.request; d=json.load(sys.stdin); url=d['data'][0]['url']; print('downloading',url); urllib.request.urlretrieve(url, '_modules/12-ai-floorplan/demo-floorplans/ci-47sqm.png'); print('saved')"
          ls -la _modules/12-ai-floorplan/demo-floorplans/
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      - name: Commit CI generated image
        run: |
          git config user.email 'r31202-bot@yunshu.dev'
          git config user.name 'R31202-CI-Bot'
          git add _modules/12-ai-floorplan/demo-floorplans/ci-*.png 2>&1 || echo "no changes"
          git commit -m "ci: AGNES-generated demo floorplan (47sqm)" -m "Generated by GitHub Actions with AGNES_API_KEY" || echo "no commit needed"
          git push || echo "push denied, ok"
