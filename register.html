<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>注册 · 装报价</title>
<style>
  :root { --primary: #6366f1; --primary-2: #4338ca; --bg: #fafaff; --panel: #fff; --border: #e8e8ef; --text: #1a1a2e; --text-dim: #5e5e7a; --text-faint: #9595ad; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #fafaff 0%, #f0f0fa 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: 100%; max-width: 440px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 36px; box-shadow: 0 20px 60px rgba(99,102,241,0.08); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-logo { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(99,102,241,0.25); }
  .brand-text { font-weight: 700; font-size: 18px; }
  .badge { display: inline-block; background: var(--primary-soft); color: var(--primary); padding: 4px 12px; border-radius: 14px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: all 0.15s; }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
  .btn { width: 100%; padding: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(99,102,241,0.25); margin-top: 8px; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.35); }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-dim); }
  .alt a { color: var(--primary); font-weight: 500; }
  .terms { font-size: 11px; color: var(--text-faint); margin-top: 16px; line-height: 1.6; }
  .terms a { color: var(--primary); }
  .err { color: #f87171; font-size: 12px; margin-top: 10px; min-height: 16px; text-align: center; }
</style>
</head>
<body>

<form class="box" onsubmit="event.preventDefault(); doRegister(this);">
  <div class="brand">
    <div class="brand-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <span class="brand-text">装报价</span>
  </div>
  <div class="badge">单次付费 · 终身使用</div>
  <h1>创建账号</h1>
  <p class="sub">填手机号 + 设置密码,扫码付 ¥198 获取激活码</p>

  <div class="field">
    <label>手机号</label>
    <input type="tel" name="phone" placeholder="138 0000 0000" pattern="[0-9]{11}" maxlength="11" required>
  </div>
  <div class="field">
    <label>设置密码(至少 4 位)</label>
    <input type="password" name="password" placeholder="••••••••" required minlength="4">
  </div>
  <div class="field">
    <label>工作室 / 公司名称(可改)</label>
    <input type="text" name="workspace" placeholder="云上工作室" required>
  </div>

  <button type="submit" class="btn">🚀 创建账号</button>
  <div class="err" id="err"></div>

  <div class="terms">注册即表示同意 <a href="terms.html">用户协议</a> 和 <a href="privacy.html">隐私政策</a>。<br>本服务为本地存储,数据不上传服务器。</div>

  <div class="alt">已有账号?<a href="login.html">立即登录 →</a></div>
</form>

<script>
function doRegister(form) {
  const phone = form.phone.value.trim();
  const pwd = form.password.value;
  const workspace = form.workspace.value.trim();
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  if (!/^1[3-9][0-9]{9}$/.test(phone)) {
    errEl.textContent = '请输入正确的 11 位手机号';
    return;
  }
  if (pwd.length < 4) { errEl.textContent = '密码至少 4 位'; return; }
  if (!workspace) { errEl.textContent = '请填写工作室名称'; return; }

  const accounts = JSON.parse(localStorage.getItem('yunshu-accounts') || '{}');
  if (accounts[phone]) {
    errEl.textContent = '该手机号已注册,请直接登录';
    setTimeout(() => window.location.href = 'login.html', 1000);
    return;
  }
  accounts[phone] = {
    pwd, workspaceName: workspace,
    at: Date.now(), activated: false
  };
  localStorage.setItem('yunshu-accounts', JSON.stringify(accounts));
  localStorage.setItem('yunshu-user', JSON.stringify({
    phone, plan: 'pending', activated: false,
    workspaceName: workspace, loginAt: Date.now()
  }));
  window.location.href = 'pending.html';
}
</script>
</body>
</html>
