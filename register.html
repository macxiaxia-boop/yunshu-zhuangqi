<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B50029">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>免费注册 · 云数装企报价系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #fafafc, #f4f4f7); color: #1a1a1f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: 100%; max-width: 440px; background: #fff; border: 1px solid #e1e1e5; border-radius: 12px; padding: 36px; box-shadow: 0 12px 48px rgba(0,0,0,0.08); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, #B50029, #8B0029); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
  .trial-badge { display: inline-block; background: #B50029; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 10px; margin-bottom: 8px; }
  h1 { font-size: 24px; margin-bottom: 6px; }
  .sub { color: #5e5e6b; font-size: 14px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #5e5e6b; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #d0d0d5; border-radius: 6px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #B50029; }
  .btn { width: 100%; padding: 12px; border: none; background: #B50029; color: #fff; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #8B0029; }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: #5e5e6b; }
  .alt a { color: #B50029; }
  .benefits { background: #f9f9fb; border-radius: 8px; padding: 16px; margin-top: 18px; font-size: 13px; line-height: 1.8; }
  .benefits strong { display: block; margin-bottom: 6px; color: #1a1a1f; }
  .benefits li { color: #5e5e6b; list-style: none; padding: 2px 0; }
  .benefits li::before { content: "✓ "; color: #16a34a; font-weight: 700; }
  .terms { font-size: 11px; color: #8e8e9a; margin-top: 12px; line-height: 1.5; }
  .terms a { color: #B50029; }
</style>
</head>
<body>
<form class="box" onsubmit="event.preventDefault(); doRegister(this);">
  <div class="brand">
    <div class="brand-logo">云</div>
    <span style="font-weight:600;">云数装企</span>
  </div>
  <div class="trial-badge">💡 完全免费 · 无需注册</div>
  <h1>个性化配置(可选)</h1>
  <p class="sub">数据保存在本地浏览器,不上传服务器</p>

  <div class="field">
    <label>邮箱(可选,仅用于显示)</label>
    <input type="email" name="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>工作室 / 公司名称(可选)</label>
    <input type="text" name="company" placeholder="云上工作室">
  </div>

  <button type="submit" class="btn">🚀 立即开始</button>

  <div class="benefits">
    <strong>所有功能免费:</strong>
    <li>无限项目</li>
    <li>所有 11 模块</li>
    <li>6 主题色</li>
    <li>导出报价书</li>
    <li>PWA / 移动端支持</li>
  </div>

  <div class="terms">
    使用即表示同意 <a href="terms.html">用户协议</a> 和 <a href="privacy.html">隐私政策</a>。
    本服务完全免费开源,不上传任何数据。
  </div>

  <div class="alt">想直接体验?<a href="app.html">跳过注册直接使用 →</a></div>
</form>

<script>
function doRegister(form) {
  const email = form.email.value.trim();
  const company = form.company.value.trim();
  localStorage.setItem('yunshu-user', JSON.stringify({
    email: email || 'anonymous@local',
    company,
    plan: 'free',
    loginAt: Date.now()
  }));
  window.location.href = 'app.html';
}
</script>
</body>
</html>
