<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#B50029">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>登录 · 云数装企报价系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fafafc; color: #1a1a1f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: 100%; max-width: 400px; background: #fff; border: 1px solid #e1e1e5; border-radius: 12px; padding: 36px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-logo { width: 36px; height: 36px; background: linear-gradient(135deg, #B50029, #8B0029); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #5e5e6b; font-size: 14px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #5e5e6b; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #d0d0d5; border-radius: 6px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #B50029; }
  .btn { width: 100%; padding: 12px; border: none; background: #B50029; color: #fff; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #8B0029; }
  .alt { text-align: center; margin-top: 18px; font-size: 13px; color: #5e5e6b; }
  .alt a { color: #B50029; }
  .divider { text-align: center; margin: 20px 0; color: #8e8e9a; font-size: 12px; }
  .demo-note { background: #f9f9fb; border-left: 3px solid #B50029; padding: 10px 14px; font-size: 12px; color: #5e5e6b; border-radius: 4px; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<form class="box" onsubmit="event.preventDefault(); doLogin(this);">
  <div class="brand">
    <div class="brand-logo">云</div>
    <span style="font-weight:600;">云数装企</span>
  </div>
  <h1>欢迎回来</h1>
  <p class="sub">登录后继续您的报价工作</p>

  <div class="field">
    <label>邮箱</label>
    <input type="email" name="email" placeholder="you@example.com" required>
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" name="password" placeholder="您注册时设置的密码" required minlength="4">
  </div>

  <button type="submit" class="btn">登录</button>

  <div class="alt">还没账号?<a href="register.html">立即注册 →</a></div>

  <div class="demo-note">
    💡 <strong>提示:</strong> 本服务需要登录使用。注册后通过 <b style="color:#B50029">¥200 激活码</b> 解锁全部功能(单次付费,终身使用)。
  </div>
</form>

<script>
function doLogin(form) {
  const email = form.email.value.trim().toLowerCase();
  const pwd = form.password.value;
  if (!email || !pwd) return;
  // 查找账号
  const users = JSON.parse(localStorage.getItem('yunshu-accounts') || '{}');
  const account = users[email];
  if (!account) {
    alert('账号不存在,请先注册');
    return;
  }
  if (account.pwd !== pwd) {
    alert('密码错误');
    return;
  }
  localStorage.setItem('yunshu-user', JSON.stringify({
    email, plan: 'paid', activated: !!account.activated, activatedAt: account.activatedAt || 0, activatedCode: account.activatedCode || '', loginAt: Date.now()
  }));
  if (!account.activated) {
    window.location.href = 'pending.html';
  } else {
    window.location.href = 'app.html';
  }
}
</script>
</body>
</html>
